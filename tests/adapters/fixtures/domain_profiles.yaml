# Профили получения/извлечения per domain (нейтральные тестовые данные, D.2).
# Оси: fetch: http|browser; extract: auto|html|document; wait_for — опц. JS-ожидание.
example.com:
  fetch: browser
  wait_for: "() => document.readyState === 'complete'"
static.example:
  fetch: http
nested.example:
  fetch: browser
  extract: document
