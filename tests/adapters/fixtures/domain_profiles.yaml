# Профили рендера per domain (нейтральные тестовые данные, D.2).
# Формы значений, поддерживаемые ScrapyCrawler:
#   * render: "http" | "browser"            — прямой режим;
#   * render: {mode: "http" | "browser"}     — вложенная форма;
#   * wait_for: "<JS-выражение>"             — опциональное ожидание готовности JS.
example.com:
  render: browser
  wait_for: "() => document.readyState === 'complete'"
static.example:
  render: http
nested.example:
  render:
    mode: browser
