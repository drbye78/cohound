# Тестовая фикстура: профиль split (03 D.5 / 07 §7).
# Нейтральна: вымышленный edge-хост, example-адаптер; без названий вендоров.
profile: split
edge:
  base_url: "https://edge.internal:8443"
  tls:
    ca: certs/ca.pem
    client_cert: certs/core.pem
    client_key: secrets/core.key
  auth: mtls
  timeout_s: 30
  max_retries: 2
  max_response_bytes: 52428800
  audit: { sink: file, target: /var/log/cohound/audit.jsonl }
extractor_zone: edge
search:
  # Бюджета здесь нет: единственный потолок поиска объявляется входом прогона
  # (run.yaml: serp.budget) — прежний search.budget ключевался по языку и ничего не
  # ограничивал (см. core/config/deploy.py:SearchDeployConfig).
  adapter: example_adapter
  serp:
    rounds: 2
