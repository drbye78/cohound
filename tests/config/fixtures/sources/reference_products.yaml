# Reference-продукты пакета-фикстуры (план 27 §3.1). Идентификаторы нейтральны (§1.3).
# Каждая строка `baselines.csv` обязана иметь объявленного предка, иначе линтер блокирует
# прогон правилом `baseline-without-reference-product`.
schema: reference_products/1
products:
  - baseline_id: baseline_a
    product_id: ref_a
    canonical_name: "Reference A"
    current_version: "1"
    versions:
      - version: "1"
        docs_roots:
          - "https://ref-a.test/docs"
  - baseline_id: baseline_b
    product_id: ref_b
    canonical_name: "Reference B"
    current_version: "1"
    versions:
      - version: "1"
        docs_roots:
          - "https://ref-b.test/docs"
