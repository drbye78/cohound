  # карты возможностей продукта, а корень, который идёт последним, может не выполниться
  # (живой прогон 22.10: портал 800 страниц шёл первым и docs не начался вовсе).
  - "postgrespro.ru/docs"
  - "postgrespro.ru/products/postgrespro/enterprise"
  - "postgrespro.ru"
  # Учебные материалы (курсы/раздатки) — вспомогательный контент, поэтому последним и со
  # своим профилем-потолком. Объявлен явно: до 22.10 он попадал в партицию только как
  # «любой поддомен» postgrespro.ru и съедал бюджет корня (664 элемента).
  - "edu.postgrespro.ru"
