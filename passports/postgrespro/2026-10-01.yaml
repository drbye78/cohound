# Паспорт продукта (§4.3). Источник: comp_0.xlsx «Лист1» (снимок 2026-10-01).
product_id: postgrespro
canonical_name: "Postgres Pro Enterprise / Certified"
vendor: "Postgres Professional"
upstreams:
  -
    baseline_id: upstream-pg
    version: "18"
    evidence:
      url: "https://postgrespro.ru/products/postgrespro"
      quote: "Российская СУБД корпоративного уровня на базе PostgreSQL с расширенной функциональностью"
edition_assessed: "Enterprise / Certified"
version: "Postgres Pro Enterprise 18.4.1 (2026); Standard 18.4.1 (18.06.2026)"
jurisdiction: RU
doc_domains:
  # Порядок — **авторский** и значимый: seed-корни дренятся в этом порядке, а не в
  # лексикографическом (execution_change §13). Docs-корень первым: это высшая ценность для
  # карты возможностей продукта, а корень, который идёт последним, может не выполниться
  # (живой прогон 22.10: портал 800 страниц шёл первым и docs не начался вовсе).
  # Граница сужена 24.11.2026 (решение владельца): было `postgrespro.ru/docs` — каталог
  # документации ВСЕХ продуктов вендора. Измерено на обходе `ru-pg-dbms-e11e04cbb3d9`
  # (остановлен на 40 854 документах / 8.05 GB): 166 145 адресов = 9 наборов × 53 группы
  # (набор, версия) × 3.91 (языковые варианты `?lang=`). Паспорт объявляет
  # `edition_assessed: Enterprise / Certified` и `version: Postgres Pro Enterprise
  # 18.4.1`, поэтому объявленный корпус — дерево этой редакции; 91 % скачанного
  # приходилось на версии 9.4–17 и на Standard, которых паспорт не объявляет.
  # `current` не входит: алиас переезжает на новый мажор без нового `run_id`.
  # Язык объявляется не здесь, а осью краула `exclude_queries` профиля домена
  # (`domain_profiles.yaml`): `?lang=` — отдельный адрес, а не редирект.
  - "postgrespro.ru/docs/enterprise/18"
  # Деревья сателлитов добавлены 24.11.2026 (решение владельца) — те, на которые
  # опирается retrieval-эталон O14 и которые паспорт объявляет: `ppem/2` (Enterprise
  # Manager) — 33 из 132 адресов эталона, `pg_probackup3` (объявленный сателлит,
  # `role: backup`) — 8, `ora2pgpro` (миграция) — 3. Версия — последняя из опубликованных,
  # как и у основного дерева (`/18`, а не `/current/`). Стоимость измерена по обходу
  # `e11e04cbb3d9` после языкового фильтра: ppem/2 ≈ 64 MB, pg_probackup3/3.5 ≈ 21 MB,
  # ora2pgpro/26 ≈ 16 MB.
  - "postgrespro.ru/docs/ppem/2"
  - "postgrespro.ru/docs/pg_probackup3/3.5"
  - "postgrespro.ru/docs/ora2pgpro/26"
  - "postgrespro.ru/products/postgrespro/enterprise"
  - "postgrespro.ru"
  # `edu.postgrespro.ru` (учебные материалы) выведен из корпуса решением владельца
  # 14.11.2026: 2 939 документов / 87 803 чанка (34,7 % чанков прогона
  # `ru-pg-dbms-145ad66ca3f9`) при 0 ячеек, опирающихся на его свидетельство, — во всех
  # прогонах стенда, включая два полных (905 ячеек: `2a5b51af5778`, `c2e7b860ac17`).
  # Домен остаётся фактом о продукте, но в объявленный корпус не входит; возврат — правка
  # этой строки, то есть `execution_change` и новый `run_id`. Убирать нужно здесь, а не
  # только в `corpus_urls.yaml`: тот файл — деривация `doc_domains` (`passport_urls`).
satellites:
  # Установлен: pg_probackup перечислен в функциях/стеке; роль backup (имя инструмента).
  - role: backup
    state: approved
    component: "pg_probackup"
    origin: in_house
    relationship: bundled
    evidence_state: verified
    relationship_evidence:
      url: "https://postgrespro.ru/docs"
      quote: "pg_probackup"
  # Установлен: AQO прямо определён как адаптивная оптимизация.
  - role: query_optimizer
    state: approved
    component: "AQO"
    origin: in_house
    relationship: bundled
    evidence_state: verified
    relationship_evidence:
      url: "https://postgrespro.ru/products/postgrespro"
      quote: "AQO (адаптивная оптимизация)"
snapshot_date: 2026-10-01
