# Паспорт продукта (§4.3). Снимок 2026-11-17, страница
# https://www.postgresql.org/docs/18/ (заголовок: «PostgreSQL 18.7 Documentation»,
# дата публикации страницы — 2026-11-12).
#
# РОЛЬ В ПАКЕТЕ: это **предок и точка отсчёта** когорты `ru-pg-dbms`, а не аналог.
# Δ к нему и есть ответ на вопрос профиля: что продукт добавляет к ванильному PostgreSQL.
# `product_id: postgresql` — slug, **общий** с объявленной линией reference-products
# (`sources/reference_products.yaml`: `baseline_id: upstream-pg`, `current_version: "18"`).
# Совпадение намеренное: это один и тот же продукт, объявленный дважды — как точка отсчёта
# когорты и как upstream-линия, от которой наследуются факты о документации предка.
#
# ЦЕНА И ГРАНИЦА (объявлено, чтобы читатель не принимал одно за другое):
#  * 1153 страницы по sitemap `https://www.postgresql.org/sitemap.xml` (замер 17.11.2026,
#    `grep -c 'www.postgresql.org/docs/18/'`). Это цена обхода одного корня, а не потолок:
#    бюджет корня объявлен в `run.yaml` и применяется как обычно.
#  * `robots.txt` запрещает только `/admin/`, `/account/`, `/docs/devel/`, `/list/`,
#    `/search/` и `/message-id/*` — дерево `/docs/18/` открыто целиком.
#  * Редакция **мажорная** (18): патч-релиз внутри 18 (18.7 → 18.8) меняет текст страниц
#    без смены корня. Это `content_change` (провенанс), а не смена условия измерения;
#    смена мажора — правка `doc_domains`, то есть новый `run_id`.
product_id: postgresql
canonical_name: "PostgreSQL"
vendor: "PostgreSQL Global Development Group"
# Предок сам является нулём отсчёта: у него нет вышестоящей линии, относительно которой
# его измерять. Поле предка здесь **опущено намеренно, а не забыто**: «предка нет» — это
# дефолт в обеих редакциях схемы (`upstream: Upstream | None = None` и
# `upstreams: list[Upstream] = []`), поэтому пропуск валиден при любой из них. Писать
# `upstream: null` значило бы выбрать одну редакцию и уронить загрузку при смене схемы
# (`extra="forbid"`), а `upstreams: []` — уронить её сегодня.
edition_assessed: null
version: "PostgreSQL 18.7 (страница снята 17.11.2026)"
jurisdiction: "global"
doc_domains:
  # ВЕРСИОННЫЙ корень, а не `/docs/current`: `current` — алиас, который переезжает на
  # новый мажор при релизе (сейчас каноническая ссылка страницы 18 указывает на
  # `/docs/current/index.html`), то есть корпус дрейфовал бы без нового `run_id`.
  # Замер 17.11.2026: `sitemap.xml` отдаёт ровно 1153 URL и для `/docs/18/`, и для
  # `/docs/current/` — сегодня это один и тот же набор, и именно поэтому алиас опасен:
  # он совпадает сейчас и разойдётся при выходе 19 без единой правки пакета.
  # Больше доменов не объявляем: `/docs/` без версии накрыл бы ВСЕ редакции
  # (28 320 URL в sitemap на 17.11.2026), и бюджет корня делился бы между ними —
  # ровно та ошибка, что описана в комментарии `doc_domains` пакета pangolin.
  - "www.postgresql.org/docs/18"
satellites: []
snapshot_date: 2026-11-17
