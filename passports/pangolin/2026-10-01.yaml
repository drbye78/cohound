# Паспорт продукта (§4.3). Источник: comp_0.xlsx «Лист1» (снимок 2026-10-01).
# Предок объявлен 18.11.2026 по документации продукта, а не по comp_0.xlsx: в таблице
# снимка мажора PostgreSQL не было (стр.15 «Технологический стек» перечисляет PostgreSQL
# без версии; «ядро 11.1.0» в стр.16 — версия ядра Pangolin, не PostgreSQL), поэтому до
# 18.11.2026 здесь стоял `upstreams: []` — precision-first. Артефакт перевесил документ:
# база знаний продукта даёт соответствие версий таблицей, и редакция паспорта
# (Pangolin 8.1) попадает в строку `8.x → PostgreSQL 18.x`. Цитата дословная.
product_id: pangolin
canonical_name: "Platform V Pangolin DB"
vendor: "СберТех"
upstreams:
  -
    baseline_id: upstream-pg
    version: "18"
    evidence:
      url: "https://pangolin.sbertech.ru/center/knowledge-base/use-cases/update/pangolin-core-versions/"
      quote: "| Pangolin 8.x | PostgreSQL 18.x |"
edition_assessed: null
# Редакция поднята 8.1 → 8.3 (26.11.2026) по документации вендора, а не по снимку
# comp_0.xlsx: индекс дерева `…/docs/public/PSQ/8.3.0/index.html` перечисляет
# опубликованные версии до 8.3.0 включительно, а портал HelpCenter на странице
# `https://pangolin.sbertech.ru/center/docs/8/` пишет «Релиз продукта 8.3.0» —
# то есть 8.1 больше не текущая редакция. Дата выпуска 8.3 на странице «Что нового»
# не указана, поэтому в строку версии она не вписана (precision-first: число без
# источника не публикуется). Ядро 11.1.0 и Patroni 4.1.0 из снимка 8.1 сюда НЕ
# перенесены — состав стека 8.3 не сверялся.
version: "Pangolin 8.3 (релиз продукта 8.3.0)"
jurisdiction: RU
doc_domains:
  # ГРАНИЦА СУЖЕНА 26.11.2026 (решение владельца). Было пять корней, из которых
  # `pangolin.sbertech.ru` — весь портал: обход `3a737f13962f` знал **5 053** адреса
  # `/center/docs/` и держал в корпусе ТРИ редакции сразу (`center/docs/7` = 7.3.2,
  # `center/docs/8` = 8.3.0, плюс `PSQ/8.1.0`) — тот же дефект, что у postgrespro:
  # версия не из паспорта съедала бюджет и размывала свидетельство.
  # Порядок — авторский (corpus_urls.yaml выводится отсюда, порядок = приоритет обхода):
  # дерево объявленной редакции первым, база знаний второй (на неё ссылается адрес
  # retrieval-эталона O14 `xlsx_007…`), затем сателлиты, объявленные в `satellites`.
  #
  # Почему `/PSQ/8.3.0/`, а не `/PSQ/`: префикс-родитель накрывает все 18 опубликованных
  # версий (6.1.10 … 8.3.0), бюджет корня делился бы между ними, а содержимое версий
  # дублируется — платили бы за дубликаты до дедупа по `content_hash`.
  # Почему `platformv…/PSQ/`, а не портал `pangolin…/center/docs/8`: это ОДИН И ТОТ ЖЕ
  # материал (страница `center/docs/8/about/functions` и `PSQ/8.3.0/common/documents/
  # about/functions.html` — один текст), но дерево PSQ отдаёт 200 обычному HTTP, а
  # портал требует browser+honest (антибот) и обойдён лишь на 16 %.
  - "platformv.sbertech.ru/docs/public/PSQ/8.3.0"
  - "pangolin.sbertech.ru/center/knowledge-base"
  # Сателлиты — только объявленные в `satellites` (Kintsugi — management_console,
  # CopyWala — backup) плюс GraDeLy. Версии 5/6/7, блог, `cve-policy`, сертификаты и
  # маркетинговые страницы выведены: это не документация объявленной редакции.
  - "pangolin.sbertech.ru/center/docs/copywala"
  - "pangolin.sbertech.ru/center/docs/kintsugi"
  - "pangolin.sbertech.ru/center/docs/gradely"
satellites:
  # Установлен: подтверждены существование и связь в роли (URL сайта из «Комм.» + фраза).
  - role: management_console
    state: approved
    component: "Kintsugi"
    origin: in_house
    relationship: bundled
    evidence_state: verified
    relationship_evidence:
      url: "https://pangolin.sbertech.ru"
      quote: "Kintsugi (управление)"
  # Установлен: бэкапы с FUSE — роль backup.
  - role: backup
    state: approved
    component: "CopyWala"
    origin: in_house
    relationship: bundled
    evidence_state: verified
    relationship_evidence:
      url: "https://pangolin.sbertech.ru"
      quote: "CopyWala (бэкапы с FUSE)"
snapshot_date: 2026-10-01
