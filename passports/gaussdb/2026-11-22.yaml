# Паспорт продукта (§4.3). Снимок 2026-11-22, страницы
# https://support.huaweicloud.com/productdesc-gaussdb/gaussdb_01_003.html и
# https://support.huaweicloud.com/bulletin-gaussdb/gaussdb-bulletin_0006.html
# (обе прочитаны в markdown-представлении, `…/gaussdb_01_003.md` / `…-0006.md`).
#
# РОЛЬ В ПАКЕТЕ: первый продукт профиля с **родным китайским** корпусом. Он добавлен не
# ради ещё одной СУБД в когорте, а чтобы профиль перестал быть двуязычным по факту, а не
# по объявлению: цель §1.1 — EN/RU/ZH, и до этого продукта ZH не был проверен ни на одном
# живом корпусе.
#
# ЧТО ЗДЕСЬ ОБЪЯВЛЕНО, А ЧТО НЕТ (границы, чтобы читатель не принимал одно за другое):
#  * редакция — **V2.0-10.x**, текущая базовая линия по `bulletin_0006` («GaussDB采用点分式
#    版本号…V2.0-A.B.CD.EF»); документация 8.x/3.x/2.x в корпус не входит — профиль
#    измеряет одну редакцию продукта;
#  * корпус — **не обход дерева**, а перечисление документов: HTML-страница этого сайта
#    не несёт текста (замер 22.11.2026: 77 578 байт разметки, ~1 900 символов текста,
#    ни одного абзаца документации), а markdown-представление (`rel="alternate"
#    type="text/markdown"`) несёт. Поэтому seed-набор — вывод прибора
#    `scripts/derive_llms_seeds.py` из индекса вендора `…/gaussdb/llms.txt`, и живёт он
#    в `sources/corpus_urls.yaml` (5 911 адресов), а `doc_domains` ниже называет
#    **область документации** (18 каталогов) — подсказку для `hound discover`, не список
#    для обхода. Способ получить перечисление назван отдельным полем
#    (`seed_enumeration_source`): пин пакета «corpus_urls = деривация паспортов» у этого
#    продукта не выполним — `doc_domains` не выражает перечень из 5 911 документов, — и
#    вместо ослабления проверки у объявления появился явный носитель;
#  * `satellites` пуст **намеренно**: сервисы миграции/резервного копирования Huawei Cloud
#    (DRS и подобные) — отдельные продукты со своими корпусами; объявить их спутниками
#    значило бы добавить в область ретривала партиции, которых в корпусе нет (I17).
product_id: gaussdb
canonical_name: "GaussDB"
vendor: "华为技术有限公司 (Huawei Cloud)"
# Предок объявлен по документации продукта, а не по отраслевому мнению: FAQ вендора
# называет линию и версию прямо. Цитата дословная, страница снята 22.11.2026.
# Версия 9.2 — **не** та, по которой у профиля есть `baselines.csv` (там линия 11–18),
# поэтому наследование по этому предку сегодня ничего не даёт: строка факта ищется на
# мажоре объявленной версии (`9`), а такой линии в наборе нет. Это видимое состояние
# («предок назван, фактов о нём нет»), а не ошибка: объявлять 18 вместо 9.2 значило бы
# утверждать о линии то, чего вендор не говорил.
upstreams:
  -
    baseline_id: upstream-pg
    version: "9.2"
    evidence:
      url: "https://support.huaweicloud.com/gaussdb_faq/gaussdb_01_366.html"
      quote: "最早GaussDB内核引擎基于PostgreSQL9.2开源版本不断演进"
edition_assessed: null
version: "V2.0-10.x (базовая линия документации, снято 22.11.2026)"
jurisdiction: CN
doc_domains:
  # Область документации продукта — **18 каталогов** на общем хосте поддержки Huawei Cloud,
  # а не хост и не один каталог. Хост не годится: `support.huaweicloud.com` держит
  # документацию десятков продуктов, и host-ключ затянул бы в партицию GaussDB чужие
  # руководства (I17). Один каталог тоже не годится: документация GaussDB разложена по
  # назначению (`api-`, `bestpractice-`, `centralized-*`, `distributed-*`, `productdesc-`,
  # `usermanual-`, `gaussdb_faq`, …), и это **измерено**, а не предположено — перепись
  # фактического seed-набора даёт ровно эти 18 каталогов на 5 911 адресов
  # (`docs/reports/measurements/2026-11-22-gaussdb-corpus.md`).
  #
  # Список служит двум вещам: он объявляет область, внутри которой тест пакета проверяет
  # **каждый** seed (адрес вне области — дефект scope, а не мелочь), и он же — подсказка
  # для `hound discover` (`doc_domains` как seed-запросы, никогда не фетчится молча).
  - "support.huaweicloud.com/api-gaussdb"
  - "support.huaweicloud.com/bestpractice-gaussdb"
  - "support.huaweicloud.com/bulletin-gaussdb"
  - "support.huaweicloud.com/centralized-devg-v10-gaussdb"
  - "support.huaweicloud.com/centralized-ref-v10-gaussdb"
  - "support.huaweicloud.com/centralized-tngg-v10-gaussdb"
  - "support.huaweicloud.com/centralized-vector-devg-v10-gaussdb"
  - "support.huaweicloud.com/clir-gaussdb"
  - "support.huaweicloud.com/distributed-devg-v10-gaussdb"
  - "support.huaweicloud.com/distributed-m-comp-devg-v10-gaussdb"
  - "support.huaweicloud.com/distributed-ref-v10-gaussdb"
  - "support.huaweicloud.com/distributed-tngg-v10-gaussdb"
  - "support.huaweicloud.com/gaussdb_faq"
  - "support.huaweicloud.com/productdesc-gaussdb"
  - "support.huaweicloud.com/pwp-gaussdb"
  - "support.huaweicloud.com/qs-gaussdb"
  - "support.huaweicloud.com/sdkreference-gaussdb"
  - "support.huaweicloud.com/usermanual-gaussdb"
# Область документации объявлена выше (``doc_domains``), но seed-набор ею **не
# выражается**: ``doc_domains`` — подсказка «где живёт документация», а здесь нужен
# перечень 5 911 документов, потому что страница каталога не несёт текста. Источник
# перечисления назван явно, чтобы «5 911 адресов» имели автора и проверяемое
# происхождение: это машинный индекс вендора, из которого `scripts/derive_llms_seeds.py`
# выводит блок `corpus_urls.yaml`. Смена источника — новый прогон (`passports_digest`).
seed_enumeration_source: "https://support.huaweicloud.com/gaussdb/llms.txt"
satellites: []
snapshot_date: 2026-11-22
