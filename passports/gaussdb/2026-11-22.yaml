# Паспорт продукта (§4.3). Снимок 2026-11-22, страницы
# https://support.huaweicloud.com/productdesc-gaussdb/gaussdb_01_003.html и
# https://support.huaweicloud.com/bulletin-gaussdb/gaussdb-bulletin_0006.html
# (обе прочитаны в markdown-представлении, `…/gaussdb_01_003.md` / `…-0006.md`).
#
# РОЛЬ В ПАКЕТЕ: первый продукт профиля с **родным китайским** корпусом. Он добавлен не
# ради ещё одной СУБД в когорте, а чтобы профиль перестал быть двуязычным по факту, а не
# по объявлению: цель §1.1 — EN/RU/ZH, и до этого продукта ZH не был проверен ни на одном
# живом корпусе.
#
# ЧТО ЗДЕСЬ ОБЪЯВЛЕНО, А ЧТО НЕТ (границы, чтобы читатель не принимал одно за другое):
#  * редакция — **V2.0-10.x**, текущая базовая линия по `bulletin_0006` («GaussDB采用点分式
#    版本号…V2.0-A.B.CD.EF»); документация 8.x/3.x/2.x в корпус не входит — профиль
#    измеряет одну редакцию продукта;
#  * корпус — **не обход дерева**, а перечисление документов: HTML-страница этого сайта
#    не несёт текста (замер 22.11.2026: 77 578 байт разметки, ~1 900 символов текста,
#    ни одного абзаца документации), а markdown-представление (`rel="alternate"
#    type="text/markdown"`) несёт. Поэтому seed-набор — вывод прибора
#    `scripts/derive_llms_seeds.py` из индекса вендора `…/gaussdb/llms.txt`, и живёт он
#    в `sources/corpus_urls.yaml` (5 912 адресов), а `doc_domains` ниже называет только
#    **область документации** — подсказку для `hound discover`, не список для обхода;
#  * `satellites` пуст **намеренно**: сервисы миграции/резервного копирования Huawei Cloud
#    (DRS и подобные) — отдельные продукты со своими корпусами; объявить их спутниками
#    значило бы добавить в область ретривала партиции, которых в корпусе нет (I17).
product_id: gaussdb
canonical_name: "GaussDB"
vendor: "华为技术有限公司 (Huawei Cloud)"
# Предок объявлен по документации продукта, а не по отраслевому мнению: FAQ вендора
# называет линию и версию прямо. Цитата дословная, страница снята 22.11.2026.
# Версия 9.2 — **не** та, по которой у профиля есть `baselines.csv` (там линия 11–18),
# поэтому наследование по этому предку сегодня ничего не даёт: строка факта ищется на
# мажоре объявленной версии (`9`), а такой линии в наборе нет. Это видимое состояние
# («предок назван, фактов о нём нет»), а не ошибка: объявлять 18 вместо 9.2 значило бы
# утверждать о линии то, чего вендор не говорил.
upstreams:
  -
    baseline_id: upstream-pg
    version: "9.2"
    evidence:
      url: "https://support.huaweicloud.com/gaussdb_faq/gaussdb_01_366.html"
      quote: "最早GaussDB内核引擎基于PostgreSQL9.2开源版本不断演进"
edition_assessed: null
version: "V2.0-10.x (базовая линия документации, снято 22.11.2026)"
jurisdiction: CN
doc_domains:
  # Область документации продукта на общем хосте поддержки Huawei Cloud. Путь, а не хост:
  # `support.huaweicloud.com` держит документацию десятков продуктов, и host-ключ затянул
  # бы в партицию GaussDB чужие руководства (I17).
  - "support.huaweicloud.com/gaussdb"
satellites: []
snapshot_date: 2026-11-22
