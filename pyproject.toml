[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cohound"
version = "0.0.0"
description = "coHound — сравнительная техническая карта продуктов по публично доказуемой функциональности"
readme = "AGENTS.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [{ name = "Marusin Dmitry", email = "drbye@mail.ru" }]

# Ядро (MVP, §3.2 + docs/architecture/05-dependency-stack.md).
# Базлайн — Python 3.14 (greenfield, контролируемое развёртывание; все зависимости стека
# имеют cp314/abi3/py3-колёса — см. 05 §1). Тяжёлые контуры — в extras.
dependencies = [
    "pydantic>=2.13,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# CLI-ядро ретривала/домена: numpy для .npy-шардов, tantivy для BM25.
# ВНИМАНИЕ: имя пакета — tantivy (НЕ tantivy-py, тот устарел).
retrieval = [
    "numpy>=2.5,<3",
    "tantivy>=0.26,<0.27",
]

# Краулинг/фетч (без экстракции).
crawl = [
    "Scrapy>=2.19,<3",
    "scrapy-playwright>=0.0.48",
    "playwright>=1.63,<2",
    "httpx>=0.28,<0.29",
    # «Дешёвый первый ярус» для антибот-доменов без JS (TLS/JA3-имитация);
    # не замена браузеру, только опциональный fetcher перед playwright.
    "curl_cffi>=0.16,<0.17",
]

# Экстракция HTML + Office (лёгкая, БЕЗ torch).
# ВАЖНО: полный пакет `docling` = `docling-slim[standard]` и тянет torch+torchvision+CUDA
# (~гигабайты) — не нужен для Office. Office Open XML парсится нативно, без моделей.
# ВАЖНО: `[format-office]` НЕ покрывает импорт `DocumentConverter` — его цепочка
# (pipeline→models.factories→base_ocr_model→datamodel.spatial) требует `rtree`;
# в `docling-slim` он объявлен только в extra `standard`. Добавляем явно.
extract = [
    "trafilatura>=2.3,<3",
    "docling-slim[format-office]>=2.135,<3",
    "rtree>=1.3,<2",
    "openpyxl>=3.1,<4",
]

# Экстракция PDF с layout-моделями (таблицы фич-матриц) — тяжёлая: подтягивает torch.
# Отдельное окружение; для PDF-контура обязателен (блокер M0, §3.2/§16).
extract-pdf = [
    "docling-slim[standard]>=2.135,<3",
]

# Безопасность контента (защита от prompt-injection, §10).
safety = [
    "nh3>=0.3,<0.4",
    "defusedxml>=0.7,<0.8",
]

# Надёжность и наблюдаемость (retry §7, структурные логи манифеста).
ops = [
    "tenacity>=9.2,<10",
    "structlog>=26.1,<27",
]

# Локальные эмбеддинги (индекс-контур, отдельное окружение: тянет torch).
# В окружении Python 3.14 может не встать — см. V2 в 05-dependency-stack.md.
embed = [
    "sentence-transformers>=6.1,<7",
]

# Лёгкая эмбеддинг-ветка без torch (CPU, статичные эмбеддинги).
embed-lite = [
    "model2vec>=0.9,<0.10",
]

# ANN-подмена NpyVectorIndex по триггеру §15.
ann = [
    "faiss-cpu>=1.15,<2",
]

# Опциональные fallback-экстракторы и утилиты (b-вердикты реестра).
fallback = [
    "markitdown>=0.1,<0.2",
    "pypdf>=6.19,<7",
    "pdfplumber>=0.11,<0.12",
    "selectolax>=1.0,<2",
    "beautifulsoup4>=4.15,<5",
    "markdownify>=1.2,<2",
]

# Dev/CI (§11.6): pytest пока не установлен — нужен для CI.
dev = [
    "pytest>=9.1,<10",
    "hypothesis>=6.168,<7",
    "respx>=0.23,<0.24",
    "pytest-cov>=7.1,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["selfcheck.py", "test_*.py"]

[tool.coverage.run]
source = ["core"]
branch = true

[tool.coverage.report]
# Порог покрытия ядра (W1/T1.5). Текущий запас — см. CI; повышается по мере W2/W3.
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.setuptools]
# Плоская раскладка: пакет core/ в корне репозитория (§3.3 регламента).
packages = ["core", "core.util", "core.adapters", "core.ports", "core.domain", "core.store", "core.pipeline", "core.config", "core.cli", "core.edge"]
