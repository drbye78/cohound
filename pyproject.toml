[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cohound"
version = "0.1.0"
description = "coHound — сравнительная техническая карта продуктов по публично доказуемой функциональности"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marusin Dmitry", email = "drbye@mail.ru" }]

# Ядро (MVP, §3.2 + docs/architecture/05-dependency-stack.md).
# Базлайн — Python 3.14 (greenfield, контролируемое развёртывание; все зависимости стека
# имеют cp314/abi3/py3-колёса — см. 05 §1). Тяжёлые контуры — в extras.
dependencies = [
    "markdown-it-py>=4.2,<5",
    "mdit-py-plugins>=0.6,<0.7",
    "pydantic>=2.13,<3",
    # Механизм `text_layer` (ось `crawl.pdf_pipeline`): текстовый слой PDF без моделей,
    # колесо без torch/transformers. Объявленная ось обязана быть исполнимой без установки
    # extra (R5), поэтому зависимость **базовая**, а не член `extract`/`extract-pdf`.
    "pypdfium2>=5.14,<6",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# CLI-ядро ретривала/домена: numpy для .npy-шардов, tantivy для BM25.
# ВНИМАНИЕ: имя пакета — tantivy (НЕ tantivy-py, тот устарел).
retrieval = [
    "numpy>=2.5,<3",
    "tantivy>=0.26,<0.27",
]

# Краулинг/фетч (без экстракции).
crawl = [
    "Scrapy>=2.19,<3",
    "scrapy-playwright>=0.0.48",
    "playwright>=1.63,<2",
    "httpx>=0.28,<0.29",
]

# Экстракция HTML + Office (лёгкая, БЕЗ torch).
# ВАЖНО: полный пакет `docling` = `docling-slim[standard]` и тянет torch+torchvision
# (~гигабайты) — не нужен для Office. Office Open XML парсится нативно, без моделей.
# В PDF-контуре (`extract-pdf`) torch/torchvision берутся одним источником из индекса
# `pytorch-cu130` (CUDA 13.0; на машине без NVIDIA те же колёса работают на CPU) — см.
# [tool.uv.sources]/[[tool.uv.index]] ниже.
# ВАЖНО: `[format-office]` НЕ покрывает импорт `DocumentConverter` — его цепочка
# (pipeline→models.factories→base_ocr_model→datamodel.spatial) требует `rtree`;
# в `docling-slim` он объявлен только в extra `standard`. Добавляем явно.
extract = [
    "trafilatura>=2.3,<3",
    "docling-slim[format-office]>=2.135,<3",
    "rtree>=1.3,<2",
    "openpyxl>=3.1,<4",
]

# Экстракция PDF с layout-моделями (таблицы фич-матриц) — тяжёлая: подтягивает torch.
# Отдельное окружение; для PDF-контура обязателен (блокер M0, §3.2/§16).
extract-pdf = [
    "docling-slim[standard]>=2.135,<3",
    # OCR-движок docling 2.135 (RapidOcrModel) импортирует PP_OCRV6_LANGS из
    # rapidocr.utils.model_resolver, а rapidocr 3.10.0 этот символ удалил. Метаданные
    # docling объявляют лишь `rapidocr<4.0.0,>=3.9.1`, поэтому 3.10.0 проходит резолв,
    # но ломает импорт: «No OCR engine found» → при document_level=full OCR молча
    # выключается. Прямой пин держит рабочую ветку 3.9.x; диапазон перепроверить при
    # обновлении docling (возможно, 3.10+ станет совместим).
    "rapidocr>=3.9.1,<3.10",
    # CPU/GPU-ядра PyTorch — прямые зависимости, чтобы применился [tool.uv.sources] ниже
    # (sources действуют только для прямых зависимостей проекта). Иначе docling тянет
    # чужое колесо torchvision с pypi.org, несовместимое по ABI с выбранным torch
    # («operator torchvision::nms does not exist»), и PDF-контур даёт пустой текст.
    # Оба пакета обязаны приходить из **одного** индекса — это и есть причина, по которой
    # они объявлены парой: ABI-пара torch/torchvision не собирается из разных сборок.
    "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1,<0.30",
]

# Безопасность контента (защита от prompt-injection, §10).
safety = [
    "nh3>=0.3,<0.4",
    "defusedxml>=0.7,<0.8",
]

# Спуск в контейнеры-артефакты (zip/7z/rar) — следующий слой после допуска/retention.
# Ленивые бэкенды контейнеров (базовый `extract` не меняется).
# Лицензии/заменяемость — docs/architecture/05-dependency-stack.md.
#   * py7zr — LGPL-2.1-or-later: исключение зафиксировано (unmodified wheel, отдельный
#     extra, swap-able; копирование кода в репозиторий запрещено);
#   * rarfile — ISC; сжатые члены требуют внешнего bsdtar/unrar/7z (в образ не тащим:
#     отсутствие утилиты — видимый attachment_skip(extractor_unavailable));
#   * zipfile (stdlib) — ZipCrypto read-only, bomb-guard нет (границы — archive_* оси).
extract-archives = [
    "py7zr>=1.1.4",
    "rarfile>=4.5",
]

# Надёжность и наблюдаемость (структурные логи манифеста; ретраи реализованы вручную).
ops = [
    "structlog>=26.1,<27",
]

# Локальные эмбеддинги (индекс-контур, отдельное окружение: тянет torch).
# В окружении Python 3.14 может не встать — см. V2 в 05-dependency-stack.md.
embed = [
    "sentence-transformers>=6.1,<7",
]

# Лёгкая эмбеддинг-ветка без torch (CPU, статичные эмбеддинги).
# model2vec 0.9.0 не объявляет huggingface_hub (он приходит транзитивно) — фиксируем
# явно, т.к. адаптер резолвит пин ревизии через snapshot_download. numpy — выходной
# dtype/форма. torch/sentence-transformers сюда сознательно НЕ входят (§2.3, V3).
embed-lite = [
    "model2vec>=0.9,<0.10",
    "huggingface_hub>=1,<2",
    "numpy>=2.5,<3",
]

# ANN-подмена NpyVectorIndex по триггеру §15.
ann = [
    "faiss-cpu>=1.15,<2",
]

# Дополнительные PDF-библиотеки для измерительного скрипта
# `scripts/measure_pdf_backends.py`; не являются runtime fallback-экстракторами.
pdf-measure = [
    "pypdf>=6.19,<7",
    "pdfplumber>=0.11,<0.12",
]

# Dev/CI (§11.6).
# pytest-xdist — параллельный прогон; CI включает его автоматически,
# если модуль `xdist` доступен (иначе — последовательный graceful-fallback).
dev = [
    "pytest>=9.1,<10",
    "pytest-xdist>=3.8,<4",
    "hypothesis>=6.168,<7",
    "respx>=0.23,<0.24",
    "pytest-cov>=7.1,<8",
    "jsonschema>=4.26,<5",
    # Линтер и type-checker — гейты `scripts/ci.sh`. Проверяют класс дефектов, который
    # runtime-валидация (Pydantic) и selfcheck не видят: мёртвый код, тихое проглатывание
    # исключения, undefined-name в аннотации. Реестр решений — 05-dependency-stack §2.7.
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

# Ядра PyTorch — из официального индекса CUDA 13.0 (`cu130`), одним источником для
# torch **и** torchvision: ABI-пара собирается только из одной сборки, поэтому «torch
# отсюда, torchvision оттуда» даёт `operator torchvision::nms does not exist` и пустой
# текст PDF. Индекс объявлен с `explicit = true`: он используется ровно там, где на него
# сослался [tool.uv.sources], и не переопределяет pypi.org для остальных пакетов.
#
# Почему CUDA, а не CPU: ось `crawl.pdf_device` (P9) объявляет устройство моделей
# извлечения, и `pdf_device: cuda` обязана быть исполнимой — иначе объявленный вход можно
# объявить, но нельзя выполнить. Замер (RTX 3050 Laptop, `layout_tables`): 9.9–11.7× к
# одному CPU-воркеру. На машине без NVIDIA те же колёса импортируются и работают на CPU
# (`torch.cuda.is_available() == False`), поэтому отдельного CPU-индекса для Linux не
# нужно; macOS остаётся на CPU-индексе (колёс cu130 под darwin не существует).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["selfcheck.py", "test_*.py"]
markers = [
    # Быстрое подмножество: `pytest -m "not slow"`. Маркер помечает тяжёлые
    # интеграционные/IO-прогоны; отбор — по `--durations`, не по размеру файла.
    "slow: тяжёлые интеграционные/IO-прогоны; исключаются быстрым подмножеством (-m 'not slow')",
]

# Линтер и type-checker — реестр решений: docs/architecture/05-dependency-stack.md §2.7.1.
# Набор правил намеренно узкий и **названный**: он ловит не стиль, а классы дефектов,
# которые проект объявляет главными — молчание вместо видимого отказа (S110, BLE),
# позднее связывание в замыкании цикла (B023), мёртвый код и неиспользуемые имена
# (F401, F841, F811, F821), упрощаемые условия (SIM).
# Форматирование ruff НЕ выполняет (`ruff format` не включён): переформатирование 100k
# строк смешало бы предметные правки с косметикой и сделало бы диффы нечитаемыми.
[tool.ruff]
target-version = "py314"
extend-exclude = [
    "runs", "index_store", "corpus_raw", "eval_cache", "extract_cache", "cache", "state",
]

[tool.ruff.lint]
# SIM300 (yoda-conditions) сознательно НЕ включено, хотя класс проверок полезен:
# в ruff 0.17.3 автофикс переворачивает сравнение, если один из операндов — **вызов**, и
# создаёт ровно то йода-условие, против которого правило написано. Воспроизведение:
# `X = frozenset({"a"}); assert X == frozenset({"a"})` → диагностика «Yoda condition» →
# после `--fix` получается `assert frozenset({"a"}) == X`. Набор из 14 срабатываний дал
# 4 таких инверсии в тестах; они возвращены вручную. Включать правило, чей фикс ухудшает
# код, — хуже, чем не иметь его; вернуть, когда фикс перестанет инвертировать операнды.
select = ["E4", "E7", "E9", "F", "B", "BLE", "I", "UP", "SIM", "S", "RUF"]
ignore = [
    # RUF001/002/003 (ambiguous-unicode): комментарии и докстринги — на русском,
    # идентификаторы — на английском. Смешение алфавитов и кириллическая типографика
    # здесь норма проекта, а не дефект: 9.5k срабатываний, ноль настоящих.
    "RUF001", "RUF002", "RUF003",
    # RUF100 (unused-noqa) выключен осознанно: набор правил уже, чем конвенция
    # подавлений в коде (ANN/ARG/SLF/D/ERA/PLC не включены), поэтому «неиспользуемая»
    # noqa в терминах ruff часто подавляет правило, которое в проекте действует как
    # конвенция (278 из 400 — BLE001 при включённом BLE, остальные — код правил, которых
    # в `select` нет). Автоудаление стёрло бы намерение; мёртвые `# noqa: F401` сняты
    # вручную, когда они действительно ничего не подавляли.
    "RUF100",
    # SIM300 (yoda-conditions): фикс в ruff 0.17.3 инвертирует сравнение, когда один из
    # операндов — вызов, и создаёт ровно то йода-условие, против которого правило
    # написано. Замер: `X = frozenset({"a"}); X == frozenset({"a"})` → «Yoda detected» →
    # после `--fix` `frozenset({"a"}) == X` (4 инверсии из 14 срабатываний). Правило,
    # чей фикс ухудшает код, вреднее его отсутствия — обоснование в 05 §2.7.1.
    "SIM300",
]

[tool.ruff.lint.per-file-ignores]
# Тесты: assert — механизм, а не забытая проверка; фикстуры намеренно используют
# «небезопасные» приёмы (временные файлы, random, subprocess, литералы DSN) и
# фиксированные пароли. Всё это остаётся под правилами в `core/`.
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S301", "S311", "S314", "S603", "S607", "S608"]
"scripts/**" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.14"
# Гейт стоит на `core/domain` (чистый домен, без I/O): там ноль ошибок, и это условие
# сборки. Остальной `core/` проверяется, но против зафиксированного baseline
# (docs/architecture/mypy-baseline.txt): долг не притворяется нулём, а его рост
# блокирует сборку. Почему не `--strict` на весь `core/` — 05-dependency-stack §2.7.1.
files = ["core"]
ignore_missing_imports = true
# `untyped_calls_exclude` не нужен: аннотации есть почти везде (функций без аннотации
# возврата — 2 из 2938), долг не в отсутствии типов, а в `Any`-заражении (1581 упоминание).
# Подавлений в `core/` нет ни одного (08.11.2026: 113 → 0 за два пасса), поэтому флаг не
# скрывает долг, а ловит протухание: подавление, без которого mypy проходит, — ложь в
# коде. До включения 64 из 90 подавлений прожили незамеченными именно потому, что флаг
# был `false`; гейт видел только синтаксис, а не нужность.
warn_unused_ignores = true

[tool.coverage.run]
source = ["core"]
branch = true

[tool.coverage.report]
# Порог покрытия ядра (W1/T1.5). Текущий запас — см. CI; повышается по мере W2/W3.
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.setuptools]
# Плоская раскладка: пакет core/ в корне репозитория (§3.3 регламента).
packages = ["core", "core.util", "core.adapters", "core.ports", "core.domain", "core.store", "core.pipeline", "core.config", "core.cli", "core.cli.commands", "core.cli.package", "core.edge"]
