# ШАБЛОН доменных профилей получения/извлечения (D.2). Верхний уровень — словарь,
# каждое значение — профиль DomainProfile (fetch/extract/wait_for, strict extra=forbid).
# Ключ = host с опциональным /path; резолв приоритета — pipeline.resolve_fetch_plan.
template.example:
  # Ось получения: http (httpx) | browser (Scrapy/playwright).
  fetch: http
  # Ось извлечения: auto (по формату) | html (trafilatura) | document (docling).
  extract: auto
