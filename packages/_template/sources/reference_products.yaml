# ШАБЛОН декларации reference-продуктов профиля (план 27 §3.1, формат
# reference_products/1). НЕ ПРОДАКШН: значения — плейсхолдеры, адреса — TLD `.invalid`
# (RFC 2606), то есть заведомо несуществующие.
#
# Это **декларация**, а не наблюдение. Здесь сказано только, какие линии профиль считает
# предками и какие их версии объявляет **явно** (не «все подряд»). Наблюдения о том, что
# в документации версии V параметр действительно описан, живут отдельно —
# `sources/baseline_facts.csv`, с дословной цитатой, хешем текста и датой наблюдения.
# Смешать их значило бы выдать предположение за измерение (A3).
#
# Связи: `baseline_id` — тот же идентификатор, которым ссылаются строки `baselines.csv`
# (политика наследования по параметру) и `passport.upstreams` (предок продукта). Линия,
# на которую ссылается паспорт, обязана быть объявлена здесь — иначе линтер блокирует
# прогон правилом `passport-upstream-undeclared`.
#
# `product_id` — slug reference-продукта; он делит namespace с продуктами когорты,
# поэтому в когорту (`cohort.yaml`) и в `run.yaml: products` входить не может: линтер
# блокирует `reference-product-in-cohort`. Reference-продукт измеряется отдельной картой,
# а не в прогоне сравнения.
#
# `versions` — объявленные мажорные версии и корни их документации. `current_version` —
# версия, по которой строятся карта и наследование; остальные версии объявлены, чтобы
# `hound baseline refresh` мог сравнивать мажоры и показывать регрессии. Обе версии ниже
# числовые: нечисловая версия — линт-ошибка (`baseline-version-numeric`), потому что
# «не нашли на объявленной версии» иначе неотличимо от «сравнивать нечем».
schema: reference_products/1
products:
  - baseline_id: upstream-line
    product_id: upstream_product
    canonical_name: "TODO: каноническое имя линии-предка"
    versions:
      - version: "1"
        docs_roots: ["https://upstream.example.invalid/docs/1/"]
      - version: "2"
        docs_roots: ["https://upstream.example.invalid/docs/2/"]
    current_version: "2"
