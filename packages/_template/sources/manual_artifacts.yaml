# Ручные артефакты: байты, которые не взял краулер (схема manual_artifacts/1,
# core/pipeline/manual_artifacts.py, 13-manual-artifacts §3).
# ---------------------------------------------------------------------------
# Обход robots/CAPTCHA/платных и авторизационных барьеров запрещён (регламент §10), а
# ручной drop-in корпуса — штатный escape hatch с правилом симметрии. Это не «повторная
# попытка фетча»: фетч — действие инструмента (и он отказался), предоставление — действие
# человека (и оно записано: provided_by).
#
# Байты входят в корпус **единственным** путём I19: файл → RawPage → retention
# (corpus_raw/{product_id}/{sha256}.bin) → экстракция → чанкер → индекс. Второго пути в
# evidence нет.
#
# Отказ краула не стирается: элемент сеанса остаётся failed/robots_disallow, а
# наблюдённость материала видна отдельно — corpus_docs.origin = manual. Поэтому подача
# закрывает пробел покрытия (complete), но не переписывает историю краула.
#
# Поля записи:
#   product_id  — продукт когорты (обязателен)
#   url         — URL, по которому краулер получил отказ (обязателен). Хост обязан быть
#                 объявленным (seed-корень продукта либо ключ domain_profiles.yaml):
#                 подача **не** расширяет scope краула. SSRF-валидация и блэклист
#                 действуют как для любого URL прогона.
#   path        — путь к файлу **относительно каталога пакета** (обязателен; абсолютный
#                 путь и выход за пакет отвергаются — декларация переезжает с пакетом).
#                 Файл не перемещается и не изменяется прогоном.
#   sha256      — необязательная сверка. Объявлен и не совпал — видимая ошибка (не тихий
#                 пропуск). Не объявлен — хеш всё равно считается из байтов: объявить хеш
#                 и тем самым провести байты без проверки нельзя.
#   reason      — почему краулер не смог (audit; попадает в by_reason манифеста)
#   provided_by — кто предоставил (audit; снимает I2c-барьер именно документ, а не подпись)
#   provided_at — когда (audit)
#
# Файл — **вход прогона**, а не CLI-флаг: флаг теряется в следующем вызове, и run_id
# перестал бы описывать корпус. Дайджест объявленного (product_id, url, sha256) входит в
# execution_contract_digest → run_id (execution_change §13); path/provided_*/reason в
# дайджест не входят — это провенанс записи, а не измерение.
#
# Пример (замените на реальные данные, файл положите в sources/manual/):
#
# provide:
#   - product_id: product_a
#     url: https://docs.invalid/files/1C.pdf
#     path: sources/manual/1C.pdf
#     sha256: null
#     reason: robots_disallow
#     provided_by: owner
#     provided_at: '2026-01-01'
#
# Не объявляйте артефакт «повторной попыткой фетча» и не пытайтесь так обойти CAPTCHA или
# платный барьер: это отказ, а не пробел.

schema: manual_artifacts/1
provide: []
