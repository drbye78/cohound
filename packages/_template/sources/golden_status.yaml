# Состояние эталонного набора пакета (схема golden_status/1,
# core/pipeline/golden_status.py).
# ---------------------------------------------------------------------------
# golden.csv — ПРОВЕРОЧНЫЙ вход (§11.3), а не условие измерения: он не входит в
# execution_contract_digest, не влияет на вердикты и не меняет run_id. Поэтому «сверять
# не с чем» — законный режим (первая версия таблицы сравнения, новый продукт в когорте),
# а не недочёт пакета.
#
# Состояние объявляется ЭТИМ ФАЙЛОМ, а не CLI-флагом: ось, заданная флагом, теряется в
# следующем вызове, и прогон/артефакты перестают описывать, чем измеряли.
#
# Раскомментируйте ровно один вариант:
#
# 1) эталон есть и используется (то же поведение, что и без этого файла при наличии
#    golden.csv):
# state: present
#
# 2) эталона нет осознанно — сверка не выполняется, hound golden скажет «неприменимо»:
# state: absent
#
# 3) файл есть, но непригоден (устарел, размечен не на те продукты, часть ячеек намеренно
#    неверна). Файл НЕ удаляется — он объявляется непригодным и остаётся на месте:
# state: declined
# reason: "почему эталон не используется (обязателен)"
# declined_by: "кто объявил (обязателен)"
# declined_at: '2026-01-01'
#
# Пока файл содержит только комментарии, объявления нет и состояние выводится из наличия
# golden.csv: present при файле, absent без файла. Противоречия — видимая ошибка пакета:
# present без golden.csv, absent при существующем golden.csv, declined без reason или
# declined_by.
#
# 4) ОТДЕЛЬНЫЙ ПРОДУКТ БЕЗ ЭТАЛОНА (waiver по продукту, §11.6) — при любом state:
#    у продукта когорты нет ни одной строки golden.csv, и это решение, а не пропуск.
#    Без waiver линтер (golden-coverage, уровень incomplete) запретит прогон, а отчёт
#    покажет продукт аномалией golden_exempt_product. Поля product_id/reason/declared_by
#    обязательны: waiver без причины и автора — тихий waiver, а он запрещён.
#
# exempt_products:
#   - product_id: product_analog_b
#     reason: "эталон для продукта ещё не размечали: сверка по нему не выполняется"
#     declared_by: "владелец домена"
#     declared_at: '2026-01-01'
