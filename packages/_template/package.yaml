# ШАБЛОН пакета категории (ПГ-пакет), T6.5. НЕ ПРОДАКШН.
# Значения — заведомо фиктивные плейсхолдеры; реальные данные поставляет владелец домена.
# Категорийно-нейтрально (§1.3): ни названий продуктов, ни вендоров, ни предметных терминов.
# Архетип B — кросс-линейное сравнение (baselines пусты).
#
# Незаполненные авторские поля выражены явно (``null``/пусто) — не правдоподобным текстом.
# Пакет с такими полями помечается линтером как incomplete (A3) и не допускается к прогону:
# заполните определение роли и прочие поля перед запуском.
case_id: template
package_version: "0.0.0"
archetype: B

# Сумма весов модулей обязана быть ровно 100 (§4.2).
modules:
  - module_id: module_core
    weight: 70
  - module_id: module_ecosystem
    weight: 30

# Инженерные роли категории. ``definition``/``markers``/``query_patterns`` заполняет
# владелец домена; ``null`` ниже означает «ещё не заполнено» (A3), а не выдуманный текст.
roles:
  - role_id: role_primary
    definition: null
    markers: []
    query_patterns: {}
    core_coverage_allowed: true
    multi_instance: false
  - role_id: role_secondary
    definition: null
    markers: []
    query_patterns: {}
    core_coverage_allowed: false
    multi_instance: true

# Архетип B: эталона нет — набор baselines пуст, участие в baseline отсутствует (§1.5).
baselines: []
baseline_participant: null

# Код-заполнитель юрисдикции (реальные значения — от владельца домена).
jurisdictions: [XX]

# Идентификаторы реестров — package-scoped спецификации ``registries/{registry_id}.yaml``
# в каталоге пакета (03 §D.4); секреты в спеке не хранятся (см. headers_env).
registries: []

languages: [ru, en]
