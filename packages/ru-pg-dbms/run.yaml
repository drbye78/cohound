ranking_policy: capability_ranked
snapshot_date: '2026-10-01'
crawl:
  # Операционные (execution) дефолты краула; не методология (§13).
  strategy: honest          # для browser-доменов; HTTP-домены нормализуются в auto
  rate_limit: {min_s: 1.0, max_s: 5.0}   # politeness-пейсинг (corpus), per-host
  # Потолок глубины (сегментов пути) от seed-root. Глубина — не ограничитель полноты:
  # где есть sitemap, хватает 2–3 (sitemap сам даёт depth-0 seeds), 8 — где его нет.
  max_depth: 8
  # Дефолтный потолок документов на (продукт, seed-root). Per-site профиль может его
  # переопределить (site > run): у крупных сайтов бюджет выше, у крошечных — ниже.
  max_documents: 600
  # Сетевой пул воркеров; browser-фетч всё равно inline (не параллелится).
  max_workers: 3
  # Пул экстракции. Замер 2026-10, **пересмотрен после замера `queue_max_size`**:
  # пики worker'а при дефолтном queue_max_size=100 были text 1191 MiB, layout 3074,
  # layout_tables 3327, full 3911–4296 (на 68-стр. синтетике), и живой прогон
  # full + 2 воркера убит OOM-killer'ом на пике 5906 MiB. Причина была не «PDF целиком»,
  # а число страниц в полёте; адаптер теперь ставит `PDF_QUEUE_MAX_SIZE = 1`
  # (`core/adapters/extract_document.py`), и на реальном 665-стр. документе это дало
  # 4174 → 2126 MB (**−49 %**) при байт-в-байт идентичном markdown и без роста времени
  # на страницу (1.46 → 1.30 s/стр., 866 с против потолка 1800 с).
  # Отсюда layout_tables + 2 воркера ≈ 2×2126 + baseline родителя ≈ 4.8 GB из 6.9 GB —
  # помещается, но запаса немного, поэтому 2, а не «сколько ядер». Для `full` (OCR)
  # арифметика другая: 2 воркера там не проверялись после замера, а до него OOM был
  # именно на `full`.
  extract_workers: 2
  # Рециклинг воркер-процесса локальной экстракции: после N заданий процесс штатно
  # завершается, executor поднимает новый и заново строит экстрактор. Без этого рабочий
  # набор docling копится линейно (~12 MiB/документ: живой прогон OOM-killed на 456-м
  # документе при RSS ~5.9 GiB). 25 — компромисс «реже пересборка весов / ниже RSS».
  extract_max_tasks_per_child: 25
  # Уровень извлечения документных форматов (off|text|layout|layout_tables|full).
  # layout_tables, а не full: на 7 из 8 полностью измеренных документов full байт-в-байт
  # совпал с layout_tables, OCR добавлял только логотипы («Postgres», «Professional»,
  # «GIS», «Jatoba») и портил таблицы (62→37 и 73→59 строк); единственное исключение —
  # одна растровая таблица совместимости ОС, где OCR искажает названия («Astra Hoopoc»,
  # «Linu 8»). full уместен только для корпусов с растровым контентом (сканы/скриншоты),
  # где без OCR документ выпадает целиком; для текстовых PDF это чистая стоимость.
  document_level: layout_tables
  # Маркетинговый шум вне технического корпуса (glob по пути URL).
  exclude_paths: ['/blog/*', '/news/*', '/events/*', '/cases/*', '/mediacenter/*']
  # Недокументные расширения — не ингестятся (glob по basename URL). Контейнеры с
  # читателем (zip/7z/rar) здесь НЕ перечислены: их допуск — позитивная вселенная
  # crawl.attachment_formats (дефолт app-слоя), судьбу решает классификатор, а не basename.
  exclude_documents: ['*.gz', '*.tar', '*.tgz', '*.exe', '*.msi', '*.dmg',
                      '*.iso', '*.ova', '*.vmdk', '*.qcow2', '*.mp4', '*.avi', '*.css', '*.js',
                      '*.png', '*.jpg', '*.jpeg', '*.gif', '*.svg', '*.webp', '*.ico', '*.woff',
                      '*.woff2', '*.ttf']
