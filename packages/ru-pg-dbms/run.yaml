anchor: pangolin
case_id: ru-pg-dbms
cohort: cohort-ru-pg-dbms-2026-10-01
# §13: версия методологии объявлена **входом прогона**, а не только дефолтом кода
# (`RunConfig.methodology_version` → манифест → `execution_contract_digest` → `run_id`).
# 0.1.0 — сброс нумерации решением владельца 26.10.2026: методология ещё не дала ни одного
# нормального результата, 2.x описывали нереализованное. Смена этого поля — версионная
# граница (`methodology_change`, `golden-full` + пере-аннотация golden), а не правка
# «на месте».
methodology_version: '0.1.0'
focus:
  modules:
  - core
  - backup
  - management
  params: []
languages:
- ru
- en
mode: strict
package: ru-pg-dbms
products:
- pangolin
- postgrespro
- tantor
- jatoba
ranking_policy: capability_ranked
snapshot_date: '2026-10-01'
crawl:
  # Операционные (execution) дефолты краула; не методология (§13).
  strategy: honest          # для browser-доменов; HTTP-домены нормализуются в auto
  rate_limit: {min_s: 1.0, max_s: 5.0}   # politeness-пейсинг (corpus), per-host
  # Потолок глубины (сегментов пути) от seed-root. Глубина — не ограничитель полноты:
  # где есть sitemap, хватает 2–3 (sitemap сам даёт depth-0 seeds), 8 — где его нет.
  max_depth: 8
  # Дефолтный потолок документов на (продукт, seed-root). Per-site профиль может его
  # переопределить (site > run): у крупных сайтов бюджет выше, у крошечных — ниже.
  max_documents: 600
  # Сетевой пул воркеров; browser-фетч всё равно inline (не параллелится).
  max_workers: 3
  # Потолок ТЕРМИНАЛЬНОГО АРТЕФАКТА (250 MiB) — это НЕ страничный потолок.
  # `crawl.max_response_bytes` остаётся дефолтным 20 MiB и не меняется: HTML-страница
  # сверх него по-прежнему получает `payload_too_large`. Здесь — сколько вправе весить
  # допущенный артефакт, который пишется потоком в staging-файл (не в RAM): документы
  # pdf/docx/pptx/xlsx И контейнеры zip/7z/rar. Замер 2026-10: при 20 MiB все отказы
  # `payload_too_large` были контейнерами, а 40 MiB PDF отвергался на страничном потолке.
  max_artifact_bytes: 262144000
  # Пул экстракции. Ось `extract_workers` здесь **намеренно не объявлена**: число
  # выводит формула `min(floor((бюджет − parent_floor) / peak(level)), cpu_count)` из
  # бюджета памяти (`COHOUND_MEM_BUDGET_MB` либо `MemAvailable − 512 MB`) — F0/Д-7.
  # Причина не в удобстве: объявленная ось сильнее бюджета, то есть превращает
  # preflight-отказ в предупреждение, и OOM становится возможен.
  # Замер 2026-10-24 на реальном корпусе (`docs/reports/measurements/
  # 2026-10-24-docling-peaks-real-corpus.md`): пик `layout_tables` — 2131 MB на 665 стр.,
  # 3679 MB на 2763 стр. (при `PDF_QUEUE_MAX_SIZE = 1`); `3679 MB` — не «типичное», а
  # максимум по популяции, поэтому на 6.9 GiB помещается **один** воркер, а при
  # `MemAvailable < 4691 MB` прогон откажет с числами, а не упадёт OOM-killer'ом.
  # Рециклинг воркер-процесса локальной экстракции: после N заданий процесс штатно
  # завершается, executor поднимает новый и заново строит экстрактор. Без этого рабочий
  # набор docling копится линейно (~12 MiB/документ: живой прогон OOM-killed на 456-м
  # документе при RSS ~5.9 GiB). 25 — компромисс «реже пересборка весов / ниже RSS».
  # Плюс второй рычаг — возврат арен (замер 22.10, один процесс, layout_tables): после
  # 81-стр. PDF RSS 1679 MB → `malloc_trim(0)` → 1084 MB (≈600 MB ядру), второй trim
  # позже 1406 → 1240 MB; без trim четыре мелких PDF поднимали процесс с 1679 до
  # 2052 MB. Это арены glibc (не объективная потребность): пол резидента ≈1.1 GB на
  # воркер (torch 231 + docling-импорты 172 + веса ~500 + страница в полёте). Воркер
  # зовёт trim после каждого документа (`core/util/memory.py`, `_extract_worker`),
  # поэтому именно 2 воркера здесь и жизнеспособны. Рычаг операционный: `run_id` /
  # `execution_change` от него не зависят (ось не заводилась намеренно).
  extract_max_tasks_per_child: 25

  # Уровень извлечения документных форматов (off|text|layout|layout_tables|full).
  # layout_tables, а не full: на 7 из 8 полностью измеренных документов full байт-в-байт
  # совпал с layout_tables, OCR добавлял только логотипы («Postgres», «Professional»,
  # «GIS», «Jatoba») и портил таблицы (62→37 и 73→59 строк); единственное исключение —
  # одна растровая таблица совместимости ОС, где OCR искажает названия («Astra Hoopoc»,
  # «Linu 8»). full уместен только для корпусов с растровым контентом (сканы/скриншоты),
  # где без OCR документ выпадает целиком; для текстовых PDF это чистая стоимость.
  document_level: layout_tables
  # Маркетинговый шум вне технического корпуса (glob по пути URL).
  exclude_paths: ['/blog/*', '/news/*', '/events/*', '/cases/*', '/mediacenter/*']
  # Недокументные расширения — не ингестятся (glob по basename URL). Контейнеры с
  # читателем (zip/7z/rar) здесь НЕ перечислены: их допуск — позитивная вселенная
  # crawl.attachment_formats (дефолт app-слоя), судьбу решает классификатор, а не basename.
  exclude_documents: ['*.gz', '*.tar', '*.tgz', '*.exe', '*.msi', '*.dmg',
                      '*.iso', '*.ova', '*.vmdk', '*.qcow2', '*.mp4', '*.avi', '*.css', '*.js',
                      '*.png', '*.jpg', '*.jpeg', '*.gif', '*.svg', '*.webp', '*.ico', '*.woff',
                      '*.woff2', '*.ttf']
