gaussdb:
# Корень — не каталог, а **перечисление документов**: у этого сайта HTML-страница несёт
# только каркас. Замер 22.11.2026 (`curl`, страница `centralized-ref-v10-gaussdb/
# gaussdb-38-0001.html`): 77 578 байт HTML, ~1 900 символов текста, длинных прогонов
# иероглифов — один (слоган шапки), `<div id="content">` пуст, содержимое подгружается
# скриптом. Обход по `<a href>` собрал бы навигацию, а не документацию, и
# `corpus_coverage.complete` стал бы `True` на корпусе без материала.
#
# Вендор публикует ту же страницу вторым представлением — `rel="alternate"
# type="text/markdown"` (`.md`, `text/markdown`) — и полный машинный индекс
# `https://support.huaweicloud.com/gaussdb/llms.txt` (5 566 666 байт, 15 235 ссылок с
# описаниями). Поэтому seed-набор — **вывод прибора** из этого индекса, а не список,
# написанный рукой: `scripts/derive_llms_seeds.py` (перепись разделов, отбор, дедуп,
# запись блока). Вывод статичен, потому что `plan` считает `run_id` до сборки портов и
# без сети, а `seeds_digest` входит в контракт: смена индекса у вендора — новый прогон,
# а не тихо другой корпус.
#
# Срез объявлен **редакцией**: V2.0-10.x (текущая базовая линия по `bulletin-gaussdb/
# gaussdb-bulletin_0006.md`) плюс версионно-независимые руководства. Перепись индекса:
# 15 235 документов во всех редакциях; в срез входит 5 911. Вне среза и почему:
# 计费说明 16 (биллинг не описывает возможность), редакции V2.0-8.x / 3.x / 2.x
# (9 307 документов) — профиль измеряет **одну** редакцию продукта; руководства, у
# которых редакции 10.x нет вовсе (特性指南 257, 兼容性参考 174, 工具参考 17), названы
# отдельно: их отсутствие в корпусе — объявленная граница, а не пропуск.
#
# Ещё один адрес из среза **исключён прибором**: индекс вендора содержит склейку
# `https://support.huaweicloud.com/scenecode-gaussdb/https://codelabs.developer.
# huaweicloud.com/codelabs/home?pageno=1&…` (метка пустая, `[]`; одна такая ссылка на
# 15 235). Это не страница на объявленном хосте, а два адреса, слипшиеся в один: сервер
# отвечает `404`, корень получает `complete=0`, и отсутствие по всему продукту перестаёт
# быть доказуемым (I2d — носитель `bounded` требует снятия каждого корня). Замер
# 22.11.2026: прогон `ru-pg-dbms-7683e0a12112` из-за этой одной ссылки получил
# `coverage.complete=0` при 5 911 успешных снятиях из 5 912. Поэтому ссылка
# **исключается с публикацией счёта** (`исключено битых ссылок: 1`), а не тянется в
# корпус ради «полноты списка».
#
# Порядок внутри блока — порядок индекса вендора (сначала 产品介绍/开发指南, затем
# 参考/调优, последними — 常见问题 и 公告), то есть приоритет обхода, как и у остальных
# продуктов.
