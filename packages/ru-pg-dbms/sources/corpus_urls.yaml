postgrespro:
# docs — первым (высшая ценность). Учебный корень edu выведен из объявленного корпуса
# 14.11.2026 (решение владельца, см. шапку файла): раньше он затягивался как «любой
# поддомен» и съел 664 элемента бюджета корня postgrespro.ru, а docs-корень не начался.
#
# ГРАНИЦА СУЖЕНА 24.11.2026 (решение владельца): корень `/docs/` — это каталог
# документации ВСЕХ продуктов вендора, а не документация объявленной редакции.
# Измерено на прогоне `ru-pg-dbms-e11e04cbb3d9` (обход остановлен на 40 854 документах,
# 8.05 GB): 166 145 адресов = 9 наборов (`enterprise`, `postgrespro` = Standard,
# `postgresql`, `shardman`, `ppem`, `otelcol`, `pg_probackup3`, `axe`, `ora2pgpro`,
# `progate`) × 53 группы (набор, версия) × 3.91 (языковые варианты `?lang=ru|en|ru-en`).
# Паспорт объявляет `version: Postgres Pro Enterprise 18.4.1` и
# `edition_assessed: Enterprise / Certified`, поэтому объявленный корпус — дерево этой
# редакции: `/docs/enterprise/18/`. 91 % скачанного (7 288 из 8 050 MB) приходилось на
# версии 9.4–17 и на Standard, то есть на редакции, которых паспорт не объявляет.
# `current` НЕ входит: это алиас, переезжающий на новый мажор при релизе (та же причина,
# что у корня `postgresql` — `/docs/18/`, а не `/docs/current/`), а сегодня он равен 18.
# Язык: сайт отдаёт каждую страницу в трёх вариантах, и `?lang=` — отдельный адрес, а не
# редирект (`content_hash` различается у 99.9 % пар). Оставлен русский: адрес без
# параметра отдаёт русский текст (измерено: доля кириллицы 0.70–0.83), плюс явный
# `?lang=ru`. `?lang=en` и `?lang=ru-en` отсекаются осью `exclude_queries` профиля домена
# (`domain_profiles.yaml`), а не этим файлом: это ось краула, а не граница корня.
- https://postgrespro.ru/docs/enterprise/18/
# Деревья сателлитов (решение владельца 24.11.2026): на них опирается retrieval-эталон
# O14 (ppem/2 — 33 из 132 адресов, pg_probackup3 — 8, ora2pgpro — 3), и `pg_probackup`
# объявлен сателлитом продукта в паспорте (`role: backup`). Версия — последняя
# опубликованная, как и у основного дерева. Язык — той же осью `exclude_queries`.
- https://postgrespro.ru/docs/ppem/2/
- https://postgrespro.ru/docs/pg_probackup3/3.5/
- https://postgrespro.ru/docs/ora2pgpro/26/
- https://postgrespro.ru/products/postgrespro/enterprise/
- https://postgrespro.ru/
