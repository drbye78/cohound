# Наблюдение разведки корней сателлитов Pangolin (2026-11-27).
#
# Прибор: `hound package satellites roots --product pangolin --seed ROLE=URL --out …`
# (`core/pipeline/satellite_probe.py` → `core/pipeline/satellite_roots.py`).
# Это **наблюдение**, не объявление: корни в паспорте от него не меняются
# (`--apply --actor` — отдельное решение человека).
#
# Четыре прохода, потому что вопрос у них разный:
#   evidence_url  — адрес свидетельства связи из паспорта (`https://pangolin.sbertech.ru`);
#   docs_index    — индекс портала `/center/docs/` (состав разделов сайта);
#   kintsugi_page — страница самого сателлита (проверка гранулярности объявленного корня);
#   copywala_page — то же для второго сателлита.
#
# Измерено:
#   * корень портала отдаёт антибот-заглушку Qrator (`__qrator/qauth.js`, 401 по HTTP,
#     260 байт по браузеру) — поэтому «свидетельство связи» как адрес наблюдения не
#     работает вообще, и это названо, а не выдано за пустое дерево;
#   * страницы сателлитов доступны обычному HTTP (200, 30 КБ) — браузер им не нужен;
#   * у Kintsugi 8 разделов (`std/…`), у CopyWala 7 (`about`, `installation-guide`,
#     `administration-guide`, `cli-reference-guide`, `glossary`, `what-is-new`) — все
#     внутри объявленных корней `/center/docs/{kintsugi,copywala}`, то есть гранулярность
#     объявленных корней наблюдением подтверждена;
#   * состав раздела документации портала: версии `docs/5…8` плюс `copywala`, `kintsugi`,
#     `gradely` — других компонентных поддеревьев в индексе нет.
