# Наблюдение разведки корней сателлитов когорты (2026-11-27).
#
# Прибор: `hound package satellites roots --product {pid} [--role R] [--seed R=URL] --out …`
# (`core/pipeline/satellite_probe.py` → `core/pipeline/satellite_roots.py`).
# Это **наблюдение**, не объявление: паспорт от него не меняется.
#
# Что прибор теперь делает и почему:
#   * разведуются только **установленные** сателлиты (`approved`/`edited_by_human`);
#     черновик называется в выводе пропущенным (до 27.11 разведывался и он, хотя
#     объявить его корень некуда — `passport_urls` читает корни только у установленных);
#   * рекомендация требует **объявленного** адреса наблюдения (`--seed ROLE=URL`).
#     Без него причина названа: `site_root_seed` (свидетельство связи — корень сайта)
#     или `evidence_seed` (страница продукта). Обе дают навигацию сайта, а не дерево
#     документации: измерено на `tantorlabs.ru` — 88 ссылок, самый покрытый префикс
#     `/products` (11), то есть объявление маркетингового раздела;
#   * вложенные кандидаты (`/tp` → `/tp/7.1` → `/tp/7.1/instances`) не рекомендуются:
#     это выбор масштаба, а не альтернативы.
#
# Измерено (шесть проходов):
#   * postgrespro / backup: `/docs` даёт 8 вложенных кандидатов; объявленный адрес
#     `…/pg_probackup3/3.5` — 62 ссылки, родитель `…/pg_probackup3` (все версии) — 68.
#     Граница объявленной редакции 3.5 уже стоит в `doc_domains` продукта.
#   * postgrespro / query_optimizer (AQO): собственного дерева документации в индексе
#     `/docs` нет (есть `postgresql`, `postgrespro`, `enterprise`, `otelcol`,
#     `pg_probackup3`, `ora2pgpro`, `shardman`, `axe`, `ppem`, `progate`); единственные
#     кандидаты — маркетинговые `/products` и `/products/postgrespro`.
#   * tantor / management_console (Tantor Platform): дерево `docs.tantorlabs.ru/tp/7.1`
#     — 171 ссылка (`instances` 72, `admin` 52, `release_notes` 39). Версия в паспорте
#     — Platform 7.0, в документации доступна 7.1: расхождение для человека.
#   * tantor / streaming (PipelineDB): `docs.tantorlabs.ru/pipelinedb/ru/1.4-ru` — 18
#     ссылок, родитель `/pipelinedb/ru` — 20. `robots` сайта запрещает seed-адрес —
#     граница сайта, а не отсутствие материала (0.6.0).
#   * tantor / database_appliance (XData): дерева документации в наблюдении нет
#     (в `docs.tantorlabs.ru` есть `tdb`, `tp`, `pipelinedb`, `perseydb`).
#   * jatoba / security_crypto (КриптоПро): на сайте продукта документации компонента
#     нет; наблюдение дало разделы сертификатов (`/img/cert` 42, `…/tinymce` 70) —
#     это не документация. Документация КриптоПро живёт у другого вендора и в
#     объявленные хосты не входит: расширение корпуса — решение человека.
