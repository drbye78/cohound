# Per-URL режим рендера (--render-modes, Ш5) для кейса ru-pg-dbms.
# Обычный HTTP (trafilatura) не извлекает текст из SPA/JS-страниц tantorlabs.ru —
# для них нужен браузерный рендер (chromium/playwright). Поддержаны оба краулера:
# COHOUND_SCOUT_CRAWLER=browser (прямой BrowserCrawler, honest/hybrid) и scrapy.
# Большинство browser-доменов кейса уже покрыто доменными профилями
# (domain_profiles.yaml), поэтому для tantorlabs.ru этот файл теперь избыточен
# и оставлен как явный операторский fallback/override оси fetch (--render-modes).
# Это операционный вход, а не данные методологии: URL здесь — кандидаты-источники,
# не evidence до corpus_raw → hash → index (I19).
https://tantorlabs.ru/: browser
https://tantorlabs.ru/products/dbms/: browser
https://docs.tantorlabs.ru/: browser
