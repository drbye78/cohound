# Политика обновления корпуса этого пакета (план 19 §4; семантика — `03` §D.2.2).
#
# Почему `scheduled/24` объявлен здесь, а не в `config/deploy.yaml`: расписание — свойство
# **профиля**, а не узла. `deploy.yaml` описывает машину (ширина, лимиты, модель), и его
# правка не должна менять смысл «когда обновляется корпус» у всех профилей сразу.
#
# Решение владельца 21.11.2026: цель — недельное обновление на профиль, поэтому суточный
# интервал — не потолок, а объявленная частота проверки. Пропуск по расписанию — это
# **переиспользование** уже собранного корпуса, а не неполнота (методология 0.7.0): полноту
# решают снятия корней (I2d), а не факт обращения к сети в конкретном прогоне.
#
# Второй якорь переиспользования — пространство, а не только часы: если объявленные оси
# краула разошлись с теми, при которых собран корпус корня, прогон всё равно обновит корень
# (иначе он измерил бы старое пространство под новым объявлением).
#
# Файл входит в `crawl_policy_digest` (`EXECUTION_CONTRACT_FIELDS`), поэтому его правка —
# `execution_change` и новый `run_id`. `interval_hours` допустим **только** при
# `mode: scheduled`; для остальных режимов он отвергается как «интервал, который никто не
# читает».
defaults:
  mode: scheduled
  interval_hours: 24
  note: "суточная проверка обновлений; пропуск = переиспользование, не неполнота"
products:
  # Решение владельца 22.11.2026: документация этого продукта обновляется раз в 90 дней,
  # поэтому суточная проверка у него была бы работой без предмета (1 440 часов = 60 суток
  # проверок ради одного обновления). Слой `products` — самый общий из существующих, и это
  # осознанно: частота объявлена для **продукта**, а не для корня, потому что у GaussDB
  # корней 5 912 (перечисление документов, а не дерево) и запись на каждый корень была бы
  # копией одного решения.
  #
  # Пропуск по расписанию — **переиспользование**, а не неполнота (методология 0.7.0):
  # корпус остаётся тем же, полноту решают снятия корней (I2d). Второй якорь тот же, что
  # у дефолта: если объявленные оси краула разошлись с пространством последнего снятия,
  # прогон обновит корень раньше срока (иначе измерил бы старое пространство под новым
  # объявлением).
  gaussdb:
    mode: scheduled
    interval_hours: 2160
    note: "обновление раз в 90 дней (решение владельца 22.11.2026); пропуск = переиспользование"
