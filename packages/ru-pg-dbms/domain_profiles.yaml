  # Размер портала НЕ измерен и бюджетом не является заявкой на полноту: проба 10.11.2026
  # (`--run-id recon-pg_root`, бюджет 20000) взяла **3 996** документов за 23 мин и была
  # остановлена самим хостом — **980 ответов `429`** на `/list/*`. 3 996 — нижняя граница
  # сайта, а не корня продукта. 800 — выбор приоритета (портал не документация продукта),
  # а не измеренный размер; поднимать его имеет смысл только вместе с `max_depth` и
  # отдельным темпом, иначе портал съедает бюджет и время у `/docs`.
