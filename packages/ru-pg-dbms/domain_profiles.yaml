support.huaweicloud.com:
  # Документация GaussDB — единственный продукт профиля с **родным китайским** корпусом.
  #
  # Host-ключ, а НЕ path: seed-набор — 5 912 адресов `.md` в 19 разных каталогах
  # (`centralized-ref-v10-gaussdb`, `distributed-devg-v10-gaussdb`, …), и один path-ключ
  # их не накрывает. Право обхода при этом ограничено не хостом, а `max_depth: 0`.
  #
  # Почему `.md`, а не страницы: HTML-страница сайта **не несёт текста**. Замер
  # 22.11.2026 (`centralized-ref-v10-gaussdb/gaussdb-38-0001.html`): 77 578 байт
  # разметки, ~1 900 символов текста, ни одного абзаца документации, `<div id="content">`
  # пуст — содержимое подгружается скриптом. Обход по `<a href>` собрал бы навигацию и
  # дал бы `complete=True` на корпусе без материала. Markdown-представление
  # (`rel="alternate" type="text/markdown"`) отдаёт ровно текст документа, поэтому
  # `fetch: http` (браузер не нужен) и `extract: auto` (маршрут по Content-Type:
  # `text/markdown` → текстовый читатель, чанкер — по заголовкам).
  #
  # `max_depth: 0` — объявленная граница, а не экономия: набор seed'ов исчерпывающий
  # (перечисление вендора), переходы по ссылкам не нужны, а любой переход был бы выходом
  # за объявленный срез. Заодно это снимает риск: хост держит документацию десятков
  # продуктов Huawei Cloud, и path-prefix каждого корня — единственное, что мешает
  # затянуть чужие руководства в партицию GaussDB (I17).
  #
  # `max_documents` здесь НЕ объявляется: бюджет — на (продукт, seed-root), а корень
  # здесь один документ, поэтому потолок прогона (600) не может сработать; меньшее
  # значение выдумало бы ограничитель там, где объём задан числом seed'ов.
  #
  # Темп ИЗМЕРЕН 22.11.2026: 40 запросов с паузой 0.05–0.2 с — 40 × `200`, ноль
  # `429`/`5xx`, латентность медиана 0.71 с / p90 1.29 с, 1.28 запроса/с последовательно.
  # Это темп, который хост **терпел**, а не его потолок: потолок не искали, поэтому
  # значение — нижняя граница терпимого, как у `docs.tantorlabs.ru`.
  extract: auto
  fetch: http
  max_depth: 0
  rate_limit:
    max_s: 0.2
    min_s: 0.05

