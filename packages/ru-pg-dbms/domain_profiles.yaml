  max_documents: 800
  rate_limit:
    max_s: 0.2
    min_s: 0.05
postgrespro.ru/docs:
  # Дерево документации: sitemap не публикуется (advertised → 404), поэтому размер
  # берётся из TOC. Замер 09.11.2026 (статика; `docs/reports/measurements/
