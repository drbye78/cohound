    max_s: 0.2
    min_s: 0.05
postgrespro.ru:
  # Host-ключ обслуживает портал (`https://postgrespro.ru/`) и страницу продукта
  # (`/products/postgrespro/enterprise/`). Дерево документации `/docs` вынесено в
