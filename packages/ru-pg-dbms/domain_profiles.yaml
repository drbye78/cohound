# Профили доменов кейса ru-pg-dbms (03 §D.2).
#
# Оси: fetch (http|browser), extract (auto|html|document), strategy (auto|honest|hybrid),
# wait_for (JS-условие готовности), rate_limit (uniform(min_s, max_s)) и бюджетные оси
# контроля краула max_depth / max_documents + per-site sitemap (D3).
# Сопоставление host[+path] и приоритет — pipeline (resolve_fetch_plan), не адаптеры.
#
# Обоснование (живые замеры, 2026-10):
#  - домены *.sbertech.ru отдают 401 обычному HTTP (антибот) → нужен browser-рендер;
#    pangolin.sbertech.ru дополнительно требует wait_for: JS-challenge завершается и
#    перезагружает страницу ПОСЛЕ domcontentloaded, поэтому снапшот без ожидания — заглушка.
#  - tantorlabs.ru/products/dbms/ — 403 обычному HTTP → browser.
#  - остальные отдают 200 обычному HTTP — браузер не требуется.
#
# Бюджеты (P7, execution_change §13, не методология): глубина — потолок, но НЕ ограничитель
# полноты; где sitemap есть, хватает 2–3 уровней (sitemap сам даёт depth-0 seeds), 8 — там,
# где sitemap отсутствует (404/500 у хоста) и глубина измеряется только эмпирически.
# Реальный ограничитель объёма — max_documents на (продукт, seed-root).
#
# Host-root seed ≠ продуктовый seed. Корень сайта компании — это не корень продукта: любой
# discovery (BFS или host-wide sitemap) затянет в партицию одного продукта страницы соседних
# продуктов (I17). Поэтому host-ключи мульти-продуктовых сайтов объявляются с max_depth 0
# (только сама страница корня), а обход живёт на path-ключе продукта.
database.diasoft.ru:
  # Host-root seed (https://database.diasoft.ru/) — корень сайта вендора, а не продукта:
  # обход с depth > 0 затянул бы в партицию Q.DataBase страницы соседних продуктов
  # Диасофта (I17). При depth 0 обходится только сам корень ⇒ бюджет 10.
  extract: auto
  fetch: http
  max_depth: 0
  max_documents: 10
database.diasoft.ru/docs/ru/q-database/versiya-180:
  # Корень документации продукта. Замер 28.10: TOC `/versiya-180/` ссылается на **700**
  # уникальных страниц (`/versiya-180/<page>/`), sitemap документации не публикует
  # (`sitemap-files.xml` — 1 URL `/docs/`, iblock-карты — 0 страниц `/docs/`), поэтому
  # глубина 8 — единственный ориентир, а размер берётся из TOC. Замер 01.11 (живой
  # прогон): при потолке 800 получено ровно 800 документов и `queue_remaining: 387` —
  # реальный размер **≥ 1187**, фронт не был исчерпан (`truncated_reason:
  # max_documents`); резал бюджет документов, а не глубина. Потолок 5000 — **проба
  # размера** (решение владельца 01.11): размер не измерен, до прогона с
  # `truncated: false` любое число — нижняя граница.
  #
  # Лимит измерен 07.11.2026 (тираж, план 22 §9): 200 документов на `{0.05, 0.2}` за 33 с
  # = **6.12 запроса/с**, ноль `429`/`5xx`, `fetch` p50/p95 147/197 мс, `in_flight_max` 4;
  # единственный отказ — `robots_disallow` (один путь).
  extract: auto
  fetch: http
  max_depth: 8
  max_documents: 5000
  rate_limit:
    max_s: 0.2
    min_s: 0.05
docs.tantorlabs.ru:
  # sitemap 404 (advertised) ⇒ размер не измерен. Замер 22.10: добыто **ровно 800**
  # документов при потолке 800 — это усечение, а не полнота. Потолок 5000 — **проба
  # размера** (решение владельца 01.11), а не заявка на размер сайта: число даст прогон,
  # у которого `truncated: false`, до тех пор любое значение — нижняя граница.
  #
  # Сид — `/tdb/`, а не корень: с миграции сайта корень отдаёт 301 на
  # `https://tantorlabs.ru/docs/` (чужая область ⇒ ноль документов, `redirect_out_of_scope`).
  # Проверено 07.11.2026 (`curl -L`: `/` → 301 → маркетинговая страница; `/tdb/` → 200,
  # `…/tdb/ru/18_6/se/differences.html`).
  extract: auto
  fetch: http
  max_depth: 8
  max_documents: 5000
  # Лимит этого хоста измерен, а не унаследован: три панели по 250–300 документов
  # (`--crawl-only`, 07.11.2026, `docs/reports/measurements/2026-11-07-crawl-rate-tantor.md`).
  # Лимит измерен на **всём корне**, а не на выборке (07.11.2026): 1207 документов за
  # 209 с на `{0.05, 0.2}` = **5.78 запроса/с**, 1207 × `200`, ноль `429`/`5xx`,
  # `in_flight_max` 3, `fetch` p50/p95 113/151 мс
  # (`docs/reports/measurements/2026-11-07-crawl-rate-tantor.md` §9). Потолок не найден:
  # корень кончился раньше, чем хост, поэтому `{0.05, 0.2}` — нижняя граница терпимого.
  # Значение ставится per-site намеренно: run-level лимит молча распространился бы на
  # неизмеренные хосты.
  rate_limit:
    max_s: 0.2
    min_s: 0.05
edu.postgrespro.ru:
  # Учебные материалы (курсы и раздатки: dba2_06_mvcc_autovacuum.html, qpt_03_seqscan.html).
  # Отдельный корень и отдельный профиль намеренно (execution_change §13): до 22.10 хост
  # попадал в партицию postgrespro только как «любой поддомен» корня postgrespro.ru и
  # израсходовал 664 элемента из 800 его бюджета (569 добыто), а docs-корень продукта не
  # получил ни одного своего элемента — прогон до него не дошёл.
  # Потолок 700 — **выше** измеренных 664 и **ниже** унаследованных 800: потолок ниже
  # измеренного объёма объявил бы весь продукт `truncated: max_documents` из-за
  # вспомогательного хоста (ложная аномалия exhaustive-отсутствия I2/I2b), а 800 — это
  # бюджет корпоративного портала, а не заявка на размер edu. 700 даёт ~5 % запаса к
  # измеренному набору и жёстко ограничивает хост. Стоимость обхода по времени
  # нейтрализована порядком: edu объявлен последним корнем (docs → продукт → портал → edu),
  # поэтому ценные корни дренируются раньше и от edu не зависят.
  #
  # Лимит объявлен 07.11.2026 тем же значением, что у быстрых хостов, но темпа он здесь
  # **не задаёт**: упор в сам хост — 200 запросов дали 0.90 запроса/с при `fetch` p50
  # 3.47 с / p95 17.9 с и `in_flight_max` 10 (очередь копилась в пуле). Отказов хоста 0;
  # 7 элементов — `payload_too_large` (потолок страницы 20 MiB, дефект контейнеров, не темп).
  extract: auto
  fetch: http
  max_depth: 8
  max_documents: 700
  rate_limit:
    max_s: 0.2
    min_s: 0.05
gaz-is.ru:
  # Host-root seed (https://www.gaz-is.ru/) — корень компании, а не продукта: любой обход
  # с depth > 0 затянет в партицию jatoba чужие продукты (I17). Продуктовые страницы
  # jatoba — на отдельном path-ключе ниже. При depth 0 обходится только сам корень,
  # поэтому бюджет 10 (как у остальных host-корней), а не 100.
  extract: auto
  fetch: http
  max_depth: 0
  max_documents: 10
gaz-is.ru/produkty/inform-sistemy/subd-jatoba:
  # Реальная раскладка сайта — /produkty/...: robots.txt перечисляет
  # /produkty/inform-sistemy/subd-jotoba (старый слаг), он 302 → .../subd-jatoba.
  # Прежний seed /products/jatoba/ отдавал 404 и исправлен в паспорте jatoba
  # (corpus_urls.yaml регенерирован). Внутри поддерева обход уместен.
  # Замер 2026-10: с лендинга продукта в scope ведут 2 URL (сам путь и .html-вариант),
  # остальные ~168 ссылок — общесайтовое меню других продуктов. 200 — потолок с запасом
  # на документы, а не заявленная полнота; 800 размером сайта не подтверждён.
  # 07.11.2026 (тираж): 17 из 18 элементов — `robots_disallow`, обход закрыт лентой ⇒
  # `rate_limit` НЕ объявляется: темп здесь ничего не измеряет, отказ виден в покрытии
  # (`complete=False`), а не в лимите.
  extract: auto
  fetch: http
  max_depth: 8
  max_documents: 200
jatoba.ru:
  # 2 URL, из них 1 PDF — бюджет 50 заведомо покрывает сайт. Глубина 2: sitemap даёт
  # depth-0 seeds, максимальная глубина пути на сайте — 1.
  # Лимит измерен 07.11.2026: 8 × `200` + 1 × `404` (терминальный), 1.33 запроса/с, отказов
  # темпа 0; `fetch` p95 5.7 с — хост медленный на отдельных страницах.
  extract: auto
  fetch: http
  max_depth: 2
  max_documents: 50
  rate_limit:
    max_s: 0.2
    min_s: 0.05
  sitemap: https://jatoba.ru/sitemap.xml
pangolin.sbertech.ru:
  # 23 URL, плоско — depth 1 + один хоп на документ. 60 покрывает 23 с запасом;
  # 600/8 размером сайта не подтверждены.
  extract: auto
  fetch: browser
  max_depth: 8
  max_documents: 600
  sitemap: https://pangolin.sbertech.ru/sitemap.xml
  strategy: honest
  wait_for: () => document.body && document.body.innerText.length > 200
# Оси хоста platformv.sbertech.ru **не однородны по пути** — измерено 29.10.2026, поэтому
# профиль расщеплён: ключ профиля — `host[/path]`, побеждает самый длинный path_key
# (`core/pipeline/fetch_plan.py:71-109`). Порядок ключей в файле — сортированный: файл
# сверяется с `yaml_dump(build_domain_profiles())` (sort_keys=True) тестом
# `tests/packages/test_build_package.py`, поэтому host-ключ идёт первым.
platformv.sbertech.ru:
  # Маркетинговые страницы продукта (`/products/rabota-s-dannymi/pangolin/`) и остальной
  # хост: 401 обычному HTTP (антибот) ⇒ browser + honest. Бюджет 300 — тот же, что был:
  # под этим префиксом дерева документации больше нет, объём мал.
  #
  # Sitemap намеренно не задан. Замер 29.10.2026: host-wide sitemap — 816 <loc>, из них
  # под /docs/public/PSQ/ **ноль** (дерево документации в карту не входит), поэтому
  # sitemap — no-op плюс запись об отказе на каждом прогоне.
  extract: auto
  fetch: browser
  max_depth: 8
  max_documents: 300
  strategy: honest
platformv.sbertech.ru/docs/public/PSQ:
  # Дерево документации PSQ. Версия выбирается корнем в `corpus_urls.yaml` (сейчас
  # 8.1.0 — редакция из паспорта), а не префиксом профиля: этот ключ описывает оси, не scope.
  # `fetch: http` — измерено: страницы документации отдают 200 обычному HTTP (проверено на
  # `/PSQ/8.1.0/`, `/PSQ/8.1.0/common/` и глубокой странице раздела), тогда как
  # маркетинговый корень того же хоста — 401. Антибот на хосте не означает антибот на
  # каждом пути хоста; до замера статическое дерево платило цену браузерного рендера.
  extract: auto
  fetch: http
  max_depth: 8
  # Бюджет выше измерения, а не «по ощущению» (замер 29.10.2026, дерево версии 8.1.0 —
  # той, что объявлена в паспорте: `version: Pangolin 8.1`):
  #   нижняя граница 1299 страниц = сумма ссылок 15 разделов
  #   `common/documents/<sec>/index.html` (about 12, administration-guide 113,
  #    architecture-components 254, description-of-functionality 99, developer-guide 10,
  #    distribution-kit 4, extensions 127, glossary 17, installation-guide 44,
  #    instructions-and-notes 12, programming-guide 222, reference-guide 50,
  #    reference-guide-postgresql 123, reference-guide-sql 206, what-is-new 6).
  # Выборочная проверка страниц даёт ещё несколько ссылок (перекрёстные), то есть 1299 —
  # нижняя граница, а не итог. Потолок ниже измерения объявил бы весь продукт
  # `truncated: max_documents` и снял бы все его ❌ (ложная аномалия I2/I2b). Потолок
  # 5000 — **проба размера** (решение владельца 01.11): нижняя граница 1299 слишком
  # близка к прежним 2000, а размер дерева не измерен; до прогона с `truncated: false`
  # любое значение — нижняя граница, а не заявка на полноту.
  max_documents: 5000
  # Лимит измерен 07.11.2026 (тираж): 200 документов на `{0.05, 0.2}` = **6.48 запроса/с**,
  # ноль отказов, `fetch` p50/p95 88/351 мс, `in_flight_max` 5 — самое быстрое дерево
  # документации из измеренных.
  rate_limit:
    max_s: 0.2
    min_s: 0.05
postgrespro.ru:
  # Портал /docs без sitemap (advertised → 404): размер не измерен, бюджет — потолок,
  # а не заявленная полнота. 800 — потому что docs-портал крупный (несколько версий
  # документации); живой прогон дошёл до 114 страниц и не был усечён бюджетом.
  # Лимит измерен 07.11.2026 (тираж): 200 документов на `{0.05, 0.2}` = **5.95 запроса/с**,
  # ноль `429`/`5xx`, `fetch` p50/p95 231/1120 мс, `in_flight_max` 10 — это ширина пула
  # узла (`max_workers`), а не следствие лимитера.
  extract: auto
  fetch: http
  max_depth: 8
  max_documents: 800
  rate_limit:
    max_s: 0.2
    min_s: 0.05
sbertech.ru:
  # Sitemap НАМЕРЕННО отсутствует на host-ключе. _sitemap_url_for(seed) резолвит самый
  # специфичный профиль, но для seed-корня https://sbertech.ru/ матчится именно этот ключ:
  # host-wide https://sbertech.ru/sitemap.xml затянул бы в партицию якоря все 89 продуктов
  # (нарушение I17). Sitemap объявлен ниже — на path-ключе sbertech.ru/documents.
  #
  # Discovery на host-корне запрещён (max_depth 0): BFS с depth 2 доходит до /documents
  # (это sitemap-URL, depth 1), затем до /documents/{slug}/{version} (depth 2) — 501 URL
  # на 89 продуктов, из которых pangolin только 22. Это та же утечка I17, что и через
  # sitemap, но BFS-путём (Frontier.in_scope матчит и поддомены). Документы pangolin
  # покрыты seed'ом /documents/platform-v-pangolin-se/ (path-ключ ниже).
  # При depth 0 обходится только сам корень — бюджет 10, а не 100.
  extract: auto
  fetch: browser
  max_depth: 0
  max_documents: 10
  strategy: honest
sbertech.ru/documents:
  # Path-scope: host-wide sitemap содержит 748 <loc>, из них 502 — /documents (501
  # /documents/{slug}/{version} + индекс) на 89 продуктов. Фильтр scope (дефект B) оставляет
  # только <loc> поддерева seed'а /documents/platform-v-pangolin-se/ — 22 URL pangolin;
  # бюджет 60 покрывает их с запасом. 800 относился бы к 502 чужим документам, которых в
  # этой партиции быть не должно (I17).
  # Глубина 2 достаточна: sitemap даёт документы subordinate seeds на depth 0, +1 хоп;
  # depth 4 покрытия не добавляет.
  extract: auto
  fetch: browser
  max_depth: 4
  max_documents: 600
  sitemap: https://sbertech.ru/sitemap.xml
  strategy: honest
tantorlabs.ru:
  # 283 URL (sitemap-индекс: 58 <loc> + дочерние фиды), 3 уровня on-host; sitemap —
  # индекс фидов, off-host habr не берём. 300 покрывает 283 с запасом.
  extract: auto
  fetch: browser
  max_depth: 3
  max_documents: 300
  sitemap: https://tantorlabs.ru/sitemap.xml
  strategy: honest
tantorlabs.ru/products/dbms:
  # Seed — глубокий путь внутри sitemap-хоста ⇒ нужен запас глубины.
  # Sitemap намеренно не задан: path-scoped seed внутри host-wide sitemap (58 <loc>,
  # в scope 3) ⇒ почти no-op; host-ключ tantorlabs.ru свой sitemap сохраняет.
  # 200 — потолок продукта; 800 не подтверждён (весь хост — 283 URL).
  extract: auto
  fetch: browser
  max_depth: 8
  max_documents: 200
  strategy: honest
wiki.astralinux.ru:
  # Host-root seed (https://wiki.astralinux.ru/) — корень общего справочного центра
  # Astra Linux, а не продукта: discovery с depth > 0 затянет в партицию tantor чужие
  # страницы (I17). Тантор-контент живёт в отдельном Confluence-пространстве TANDOCS
  # («База Знаний Tantor»), публичные URL — /tandocs/<slug>-<id>.html (живой замер
  # 2026-10: 68 уникальных /tandocs-ссылок с домашней страницы пространства;
  # /display/TANDOCS 302 → /tandocs/baza-znanij-tantor-238752972.html). Префикс —
  # именно /tandocs (path-матч литеральный; /display/TANDOCS после 302 вне scope).
  extract: auto
  fetch: http
  max_depth: 0
  max_documents: 10
wiki.astralinux.ru/tandocs:
  # Обход — только внутри пространства TANDOCS (sitemap 404 → глубина как ориентир).
  # 07.11.2026 (тираж): сид отвечает **403** обычному HTTP (1 элемент, `source_unavailable`)
  # ⇒ `rate_limit` НЕ объявляется: корень закрыт для клиента, это факт покрытия, а не темпа.
  extract: auto
  fetch: http
  max_depth: 8
  max_documents: 300
