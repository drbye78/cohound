    min_s: 0.05
postgrespro.ru/docs/enterprise/18:
  # ГРАНИЦА СУЖЕНА 24.11.2026 (решение владельца). Было `postgrespro.ru/docs` — каталог
  # документации ВСЕХ продуктов вендора. Измерено на обходе `ru-pg-dbms-e11e04cbb3d9`
  # (остановлен на 40 854 документах / 8.05 GB): 166 145 адресов = 9 наборов
  # (`enterprise`, `postgrespro` = Standard, `postgresql`, `shardman`, `ppem`, `otelcol`,
  # `pg_probackup3`, `axe`, `ora2pgpro`, `progate`) × 53 группы (набор, версия) × 3.91
  # (языковые варианты `?lang=ru|en|ru-en`). 91 % скачанного (7 288 из 8 050 MB) — версии
  # 9.4–17 и Standard, то есть редакции, которых паспорт не объявляет
  # (`edition_assessed: Enterprise / Certified`, `version: Postgres Pro Enterprise 18.4.1`).
  #
  # `max_documents` = измеренное + объявленный запас: дерево редакции — **1 267**
  # канонических страниц = **2 379** адресов после языкового фильтра (у страницы 3–4
  # варианта `?lang=`), 3 000 — это +26 % на страницы, чьи варианты частичный обход не
  # успел обнаружить. Прежние 20 000 относились к корню `/docs/` целиком.
  #
  # `exclude_queries` — язык. Сайт отдаёт каждую страницу отдельными адресами
  # (`?lang=ru`, `?lang=en`, `?lang=ru-en`), и `content_hash` у них разный у 99.9 % пар,
  # то есть это не редирект и не дубль байтов. Оставлен русский: адрес без параметра
  # отдаёт русский текст (измерено: доля кириллицы 0.70–0.83), плюс явный `?lang=ru`.
  # Ось видит query-строку, чего `exclude_paths` не умеет (он матчит только путь).
  exclude_queries:
  - lang=en
  - lang=ru-en
  extract: auto
  fetch: http
  max_depth: 8
  max_documents: 3000
  rate_limit:
    max_s: 0.2
    min_s: 0.05
