  max_documents: 20000
  rate_limit:
    max_s: 0.2
    min_s: 0.05
sbertech.ru:
  # Sitemap НАМЕРЕННО отсутствует на host-ключе. _sitemap_url_for(seed) резолвит самый
  # специфичный профиль, но для seed-корня https://sbertech.ru/ матчится именно этот ключ:
  # host-wide https://sbertech.ru/sitemap.xml затянул бы в партицию якоря все 89 продуктов
  # (нарушение I17). Sitemap объявлен ниже — на path-ключе sbertech.ru/documents.
  #
  # Discovery на host-корне запрещён (max_depth 0): BFS с depth 2 доходит до /documents
  # (это sitemap-URL, depth 1), затем до /documents/{slug}/{version} (depth 2) — 501 URL
  # на 89 продуктов, из которых pangolin только 22. Это та же утечка I17, что и через
  # sitemap, но BFS-путём (Frontier.in_scope матчит и поддомены). Документы pangolin
  # покрыты seed'ом /documents/platform-v-pangolin-se/ (path-ключ ниже).
  # При depth 0 обходится только сам корень — бюджет 10, а не 100.
  extract: auto
  fetch: browser
  max_depth: 0
  max_documents: 10
  strategy: honest
sbertech.ru/documents:
  # Path-scope: host-wide sitemap содержит 748 <loc>, из них 502 — /documents (501
  # /documents/{slug}/{version} + индекс) на 89 продуктов. Фильтр scope (дефект B) оставляет
  # только <loc> поддерева seed'а /documents/platform-v-pangolin-se/ — **27 URL pangolin**
  # (замер 09.11.2026, `sbertech.ru/sitemap.xml`: 745 `<loc>`, pangolin 27).
  # Глубина 2 достаточна: sitemap даёт документы subordinate seeds на depth 0, +1 хоп;
  # depth 4 покрытия не добавляет.
  # Бюджет 100 — выше измерения (27) с запасом на новые редакции; 600 относился бы к 502
  # чужим документам, которых в этой партиции быть не должно (I17).
  # Живой краул этого корня не проводился: `platformv`/`sbertech` отдают 401 обычному HTTP,
  # а browser-фетч сериализован. 27 — статическая нижняя граница, не `truncated: false`.
  # Замер: `docs/reports/measurements/2026-11-09-root-size-recon.md` §2, §4.
  extract: auto
  fetch: browser
  max_depth: 4
  max_documents: 100
  sitemap: https://sbertech.ru/sitemap.xml
  strategy: honest
tantorlabs.ru:
  # Размер хоста НЕ исчерпан и бюджетом не является заявкой на полноту: проба 10.11.2026
  # (`--run-id recon-tantor_root`, бюджет 20000, depth 3) взяла **9 162** документа за
  # 39 мин и была прервана таймаутом прибора (20×`504`). Прежняя оценка «283 URL по
  # sitemap-индексу» была нижней границей карты, а не размером сайта.
  # 300 — граница **I17**, а не размера: host-корень затягивает `/perseydb`, `/pipelinedb`,
  # `/polardb`, `/patroni`, `/tp`, `/dlh`, `/xdata` — чужие продукты. Для полноты нужны
  # явные продуктовые сиды (`/products/dbms/`, `/tdb/…`), а не подъём этого бюджета.
  # Замер: `docs/reports/measurements/2026-11-09-root-size-recon.md` §1, §3, §9.
  extract: auto
  fetch: browser
  max_depth: 3
  max_documents: 300
  sitemap: https://tantorlabs.ru/sitemap.xml
  strategy: honest
tantorlabs.ru/products/dbms:
  # Seed — глубокий путь внутри sitemap-хоста ⇒ нужен запас глубины.
  # Sitemap намеренно не задан: path-scoped seed внутри host-wide sitemap (58 <loc>,
  # в scope 3) ⇒ почти no-op; host-ключ tantorlabs.ru свой sitemap сохраняет.
  # Размер ИЗМЕРЕН 09.11.2026 (изолированный стенд): `crawl run --crawl-only
  # --run-id recon-tantor_dbms` ⇒ **3 документа**, `truncated: false`; статика даёт те же 3.
  # Бюджет 50 — выше измерения; 200 не подтверждался ничем (весь хост — 283 URL).
  # Замер: `docs/reports/measurements/2026-11-09-root-size-recon.md` §1, §2.
  extract: auto
  fetch: browser
  max_depth: 8
  max_documents: 50
  strategy: honest
wiki.astralinux.ru:
  # Host-root seed (https://wiki.astralinux.ru/) — корень общего справочного центра
  # Astra Linux, а не продукта: discovery с depth > 0 затянет в партицию tantor чужие
  # страницы (I17). Тантор-контент живёт в отдельном Confluence-пространстве TANDOCS
  # («База Знаний Tantor»), публичные URL — /tandocs/<slug>-<id>.html (живой замер
  # 2026-10: 68 уникальных /tandocs-ссылок с домашней страницы пространства;
  # /display/TANDOCS 302 → /tandocs/baza-znanij-tantor-238752972.html). Префикс —
  # именно /tandocs (path-матч литеральный; /display/TANDOCS после 302 вне scope).
  extract: auto
  fetch: http
  max_depth: 0
  max_documents: 10
wiki.astralinux.ru/tandocs:
  # Обход — только внутри пространства TANDOCS (sitemap 404 → глубина как ориентир).
  # 07.11.2026 (тираж): сид отвечает **403** обычному HTTP (1 элемент, `source_unavailable`)
  # ⇒ `rate_limit` НЕ объявляется: корень закрыт для клиента, это факт покрытия, а не темпа.
  # 13.11.2026 (матрица User-Agent, один и тот же URL): `Scrapy/2.19.0 (+https://scrapy.org)`
  # → **403**, `coHound-crawler/0.1` → **200**, `Mozilla/5.0 … Chrome/120` → **200**.
  # `COHOUND_SCOUT_CRAWLER=scrapy` в `.env`, а `DEFAULT_SCRAPY_SETTINGS` не задаёт
  # `USER_AGENT` (`core/adapters/crawl_scrapy.py`), поэтому Scrapy отправляет свой дефолт;
  # HTTP/browser-краулеры отправляют `coHound-crawler/0.1`. 403 — дефект провенанса
  # User-Agent, а не свойство сайта.
  # Размер ИЗМЕРЕН статически 13.11.2026 (BFS по `curl`, UA `coHound-crawler/0.1`):
  # **73 страницы** (`truncated: false` по фронту); TOC — 66 уникальных ссылок.
  # Бюджет 150 — выше измерения; 300 был пробой.
  # Замер: `docs/reports/measurements/2026-11-09-root-size-recon.md` §2, §5.1.
  extract: auto
  fetch: http
  max_depth: 8
  max_documents: 150
