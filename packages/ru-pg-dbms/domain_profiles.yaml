  # ограничитель — вопрос качества корпуса решается объявленным wait_for, которого на ключе
  # нет, и это отдельная задача, не ось стратегии.
  # Замер: docs/reports/measurements/2026-11-27-hybrid-hosts.md.
  extract: auto
