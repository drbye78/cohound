# Профили доменов кейса ru-pg-dbms (03 §D.2).
#
# Оси: fetch (http|browser), extract (auto|html|document), strategy (auto|honest|hybrid),
# wait_for (JS-условие готовности), rate_limit (uniform(min_s, max_s)) и бюджетные оси
# контроля краула max_depth / max_documents + per-site sitemap (D3).
# Сопоставление host[+path] и приоритет — pipeline (resolve_fetch_plan), не адаптеры.
#
# Обоснование (живые замеры, 2026-10):
#  - домены *.sbertech.ru отдают 401 обычному HTTP (антибот) → нужен browser-рендер;
#    pangolin.sbertech.ru дополнительно требует wait_for: JS-challenge завершается и
#    перезагружает страницу ПОСЛЕ domcontentloaded, поэтому снапшот без ожидания — заглушка.
#  - tantorlabs.ru/products/dbms/ — 403 обычному HTTP → browser.
#  - остальные отдают 200 обычному HTTP — браузер не требуется.
#
# strategy объявлена по ЗАМЕРУ 27.11.2026 (scripts/measure_hybrid_hosts.py; отчёт
# docs/reports/measurements/2026-11-27-hybrid-hosts.md). hybrid — липкий на хост режим:
# браузер платит за хост один раз (cookie + эталон рендера), дальше адреса хоста идут
# лёгким HTTP, а документы/контейнеры в браузере не навигируются вовсе. Переведены ключи,
# где мост отдал тот же текст, что honest-рендер: pangolin.sbertech.ru, tantorlabs.ru,
# tantorlabs.ru/products/dbms, sbertech.ru/documents. Остались honest:
# platformv.sbertech.ru (лёгкий GET получает челлендж на каждом адресе: 18 на 6 URL)
# и sbertech.ru как host-ключ (мост отдаёт 0.79 текста рендера).
# Перевод strategy — execution_change: оси получения контента входят в
# crawl_config_digest с 27.11.2026 (_declared_plan_axes).
#
# Бюджеты (P7, execution_change §13, не методология): глубина — потолок, но НЕ ограничитель
# полноты; где sitemap есть, хватает 2–3 уровней (sitemap сам даёт depth-0 seeds), 8 — там,
# где sitemap отсутствует (404/500 у хоста) и глубина измеряется только эмпирически.
# Реальный ограничитель объёма — max_documents на (продукт, seed-root).
#
# Host-root seed ≠ продуктовый seed. Корень сайта компании — это не корень продукта: любой
# discovery (BFS или host-wide sitemap) затянет в партицию одного продукта страницы соседних
# продуктов (I17). Поэтому host-ключи мульти-продуктовых сайтов объявляются с max_depth 0
# (только сама страница корня), а обход живёт на path-ключе продукта.
database.diasoft.ru:
  # Host-root seed (https://database.diasoft.ru/) — корень сайта вендора, а не продукта:
  # обход с depth > 0 затянул бы в партицию Q.DataBase страницы соседних продуктов
  # Диасофта (I17). При depth 0 обходится только сам корень ⇒ бюджет 10.
  extract: auto
  fetch: http
  max_depth: 0
  max_documents: 10
database.diasoft.ru/docs/ru/q-database/versiya-180:
  # Корень документации продукта. Замер 28.10: TOC `/versiya-180/` ссылается на **700**
  # уникальных страниц (`/versiya-180/<page>/`), sitemap документации не публикует
  # (`sitemap-files.xml` — 1 URL `/docs/`, iblock-карты — 0 страниц `/docs/`), поэтому
  # глубина 8 — единственный ориентир, а размер берётся из TOC.
  #
  # Размер ИЗМЕРЕН 09.11.2026 (изолированный стенд `stands/root-recon`, бюджет 20000):
  # `crawl run --crawl-only --run-id recon-diasoft180 --from-scratch` ⇒ **1 226 элементов,
  # из них 1 184 страницы**, `truncated: false` (фронт исчерпан). 42 элемента — `mailto:`,
  # отбитые SSRF; 59 попыток `?PAGEN_1=2` — `robots_disallow` (`Disallow: /*PAGEN`), при
  # этом все страницы первой страницы TOC получены. Независимый статический BFS (4 curl-
  # воркера, ≥0.1 с) даёт ровно те же 1 184 адреса — расхождение 0.
  # Бюджет 1 500 — выше измерения (запас на пагинацию, если robots её откроет).
  # Замер: `docs/reports/measurements/2026-11-09-root-size-recon.md` §1.
  #
  # Лимит измерен 07.11.2026 (тираж, план 22 §9): 200 документов на `{0.05, 0.2}` за 33 с
  # = **6.12 запроса/с**, ноль `429`/`5xx`, `fetch` p50/p95 147/197 мс, `in_flight_max` 4;
  # единственный отказ — `robots_disallow` (один путь).
  extract: auto
  fetch: http
  max_depth: 8
  max_documents: 1500
  rate_limit:
    max_s: 0.2
    min_s: 0.05
docs.tantorlabs.ru:
  # sitemap 404 (advertised). Размер ИЗМЕРЕН 12.11.2026 (изолированный стенд, бюджет
  # 20000): `crawl run --crawl-only --run-id recon-tantor_tdb --from-scratch` ⇒
  # **1 207 документов** (`truncated: false`), все — `/tdb/ru/18_6/se/`; статический BFS
  # того же дерева — 1 210 адресов. Сид `/tdb/` отдаёт 301 на
  # `…/tdb/ru/18_6/se/differences.html`, дальше обход идёт по относительным ссылкам
  # страницы и остаётся внутри `ru/18_6/se`: перекрёстных ссылок на `en/`, `se1c/`, `be/`
  # в странице **0 из 1 068** `href`. Поэтому корень покрывает **одну** редакцию;
  # `se1c` (865) и `be` (848) достижимы только отдельными сидами.
  #
  # Плоские `/tdb/<page>.html` (895 адресов в цикле `2a5b51af5778`) — все 301 на ту же
  # `differences.html` и один `content_hash`: алиасы, а не документы. Корпус того цикла
  # держал 1 168 документов, а не 2 063 элемента.
  #
  # Сид — `/tdb/`, а не корень: с миграции сайта корень отдаёт 301 на
  # `https://tantorlabs.ru/docs/` (чужая область ⇒ ноль документов, `redirect_out_of_scope`).
  # Проверено 07.11.2026 (`curl -L`: `/` → 301 → маркетинговая страница; `/tdb/` → 200,
  # `…/tdb/ru/18_6/se/differences.html`).
  # Замер: `docs/reports/measurements/2026-11-09-root-size-recon.md` §1, §5.2.
  extract: auto
  fetch: http
  max_depth: 8
  max_documents: 1500
  # Лимит этого хоста измерен, а не унаследован: три панели по 250–300 документов
  # (`--crawl-only`, 07.11.2026, `docs/reports/measurements/2026-11-07-crawl-rate-tantor.md`).
  # Лимит измерен на **всём корне**, а не на выборке (07.11.2026): 1207 документов за
  # 209 с на `{0.05, 0.2}` = **5.78 запроса/с**, 1207 × `200`, ноль `429`/`5xx`,
  # `in_flight_max` 3, `fetch` p50/p95 113/151 мс
  # (`docs/reports/measurements/2026-11-07-crawl-rate-tantor.md` §9). Потолок не найден:
  # корень кончился раньше, чем хост, поэтому `{0.05, 0.2}` — нижняя граница терпимого.
  # Значение ставится per-site намеренно: run-level лимит молча распространился бы на
  # неизмеренные хосты.
  rate_limit:
    max_s: 0.2
    min_s: 0.05
# `edu.postgrespro.ru` — НЕ профиль, а факт истории: корень выведен из объявленного корпуса
# 14.11.2026 (решение владельца: 2 939 документов / 87 803 чанка = 34,7 % при 0 ячеек на его
# свидетельстве). Ключ нельзя оставить «на всякий случай»: ключ профиля объявляет хост в
# scope (`Frontier.host_in_scope`), поэтому оставленный ключ вернул бы edu в партицию через
# sitemap/discovery, даже без seed-корня. Замер размера — `2026-11-09-root-size-recon.md`.

gaz-is.ru:
  # Host-root seed (https://www.gaz-is.ru/) — корень компании, а не продукта: любой обход
  # с depth > 0 затянет в партицию jatoba чужие продукты (I17). Продуктовые страницы
  # jatoba — на отдельном path-ключе ниже. При depth 0 обходится только сам корень,
  # поэтому бюджет 10 (как у остальных host-корней), а не 100.
  #
  # `document_level: full` — ОСОЗНАННО на host-ключе, и вот почему. Документы продукта
  # здесь — сертификаты и «Jatoba Security Vision»: PDF, заблокированные `robots.txt`
  # (`Disallow: *.pdf$`), поэтому в корпус они попадают только ручной подачей
  # (`hound artifacts fetch`), а её URL (`/files/products/jatoba/*.pdf`) лежат ВНЕ
  # path-ключа `/produkty/inform-sistemy/subd-jatoba`. Без оси на этом ключе 15 из 17
  # поданных сканов дают 0 полезных символов (текст — одни маркеры `<!-- image -->`) при
  # `error=None`, то есть входили бы в корпус как прочитанные. Замер 14.11.2026:
  # `layout_tables` — 0 символов у 15 из 17; `full` с кириллическим OCR — читаемый русский
  # у 17 из 17 (582–2058 символов, 70–81 % кириллицы), 18 страниц ≈ 74 с CPU.
  # Цена ограничена хостом: остальной корпус остаётся на оси прогона (`layout_tables`).
  document_level: full
  extract: auto
  # Окно извлечения объявлено явно (P4) — не «побольше», а ровно то, что дала бы формула
  # при достаточном бюджете: `floor((budget − 500) / peak(full))` = 1 при любом бюджете
  # до 5 333 MB. Причина объявления — не желание обойти гейт, а его ложное срабатывание
  # на пике ПОПУЛЯЦИИ: `PEAK_MB[full]` = 4 833 измерен на 2 763-страничном документе
  # (`2026-10-24-docling-peaks-real-corpus.md`), а на этом хосте документов такого класса
  # нет — 17 поданных сканов ≤ 20 страниц (582–2058 символов текста, 18 страниц ≈ 74 с).
  # 21.11.2026 preflight отказал в старте: MemAvailable 5 156 MB − 512 = 4 644 < 4 833 ⇒
  # `workers=0`, хотя выведенное окно всё равно 1. Ось не входит в `CrawlLimits.as_dict()`
  # (расписание, а не условие измерения) ⇒ `run_id` не меняется; расхождение с бюджетом
  # печатается предупреждением с числами, а не молчит.
  extract_workers: 1
  fetch: http
  max_depth: 0
  max_documents: 10
gaz-is.ru/produkty/inform-sistemy/subd-jatoba:
  # Реальная раскладка сайта — /produkty/...: robots.txt перечисляет
  # /produkty/inform-sistemy/subd-jotoba (старый слаг), он 302 → .../subd-jatoba.
  # Прежний seed /products/jatoba/ отдавал 404 и исправлен в паспорте jatoba
  # (corpus_urls.yaml регенерирован). Внутри поддерева обход уместен.
  # Замер 2026-10: с лендинга продукта в scope ведут 2 URL (сам путь и .html-вариант),
  # остальные ~168 ссылок — общесайтовое меню других продуктов. 200 — потолок с запасом
  # на документы, а не заявленная полнота; 800 размером сайта не подтверждён.
  # 07.11.2026 (тираж): 17 из 18 элементов — `robots_disallow`, обход закрыт лентой ⇒
  # `rate_limit` НЕ объявляется: темп здесь ничего не измеряет, отказ виден в покрытии
  # (`complete=False`), а не в лимите.
  #
  # Размер ИЗМЕРЕН 10.11.2026 (изолированный стенд): `crawl run --crawl-only
  # --run-id recon-gazis_jatoba` ⇒ **1 HTML в scope** + 17 отказов `robots_disallow`.
  # Статика: 3 ссылки TOC, 2 в scope; `robots.txt` закрывает `*.pdf$`, а PDF продукта
  # (сертификаты, «Jatoba Security Vision») — это и есть его документы. Бюджет 50 —
  # выше измерения (2 HTML + запас), 200 не подтверждались ничем.
  # Замер: `docs/reports/measurements/2026-11-09-root-size-recon.md` §1, §5.5.
  extract: auto
  fetch: http
  max_depth: 8
  max_documents: 50
jatoba.ru:
  # Глубина 2: sitemap даёт depth-0 seeds, максимальная глубина пути на сайте — 1.
  # Размер ИЗМЕРЕН 09.11.2026 (изолированный стенд): `crawl run --crawl-only
  # --run-id recon-jatoba` ⇒ **7 документов**, `truncated: false`; 9 запросов, единственный
  # отказ — `Jatoba2026.pdf` (`404`, терминальный). 50 — выше измерения, менять нечего.
  # Лимит измерен 07.11.2026: 8 × `200` + 1 × `404` (терминальный), 1.33 запроса/с, отказов
  # темпа 0; `fetch` p95 5.7 с — хост медленный на отдельных страницах.
  # Замер: `docs/reports/measurements/2026-11-09-root-size-recon.md` §1.
  extract: auto
  fetch: http
  max_depth: 2
  max_documents: 50
  rate_limit:
    max_s: 0.2
    min_s: 0.05
  sitemap: https://jatoba.ru/sitemap.xml
pangolin.sbertech.ru:
  # ГРАНИЦА СУЖЕНА 26.11.2026 (решение владельца). Этот ключ больше НЕ обслуживает
  # host-корень: объявленные корни — четыре поддерева портала
  # (`/center/knowledge-base/`, `/center/docs/{copywala,kintsugi,gradely}/`). Раньше
  # корнем был весь портал, и в корпусе оказывались ТРИ редакции сразу
  # (`center/docs/7` = 7.3.2, `center/docs/8` = 8.3.0) плюс блог, `cve-policy`,
  # сертификаты — измерено по `state.db`: 5 053 адреса под `/center/docs/`.
  #
  # `max_documents` = измеренное + запас, по каждому корню отдельно (бюджет считается на
  # (продукт, seed-root), а не на ключ профиля). Известные размеры из `url_state` обхода
  # `3a737f13962f`: knowledge-base **135**, copywala **344**, kintsugi **122**,
  # gradely **186**. 3 500 — исторический бюджет host-корня (статическая нижняя граница
  # 3 025 по всем версиям, замер 13.11.2026), он выше любого из четырёх корней и потому
  # ничего не усекает; точные пределы объявит `hound crawl drain --apply` после
  # исчерпания корней (план 29). Потолок ниже известного размера был бы гарантированным
  # усечением — поэтому не занижается «на глаз».
  # Замер: `docs/reports/measurements/2026-11-09-root-size-recon.md` §1, §3.
  #
  # Вежливость и параллелизм объявлены 23.11.2026 (execution_change ⇒ новый `run_id`).
  # Замер 23.11.2026 на прогоне `3a737f13962f` (3 621 живой фетч): интервал между стартами
  # p50 **3.81 с** при `fetch_ms` p50 767 / p95 1 232 мс ⇒ ~3 с из 3.81 — пауза
  # `uniform(1.0, 5.0)` из `run.yaml:crawl.rate_limit`, а не сайт; `in_flight_max = 1`.
  # Отсюда `rate_limit 0.2…3`: тот же порядок вежливости без 5-секундного хвоста (p50
  # интервала ожидается ≈2.4 с, то есть корень 3 025 — ≈2 ч вместо 4 ч 20 мин).
  # `browser_workers: 2` — браузерный фетч перестал быть сериализованным. Честная
  # граница: лимитер резервирует слот **на origin**, поэтому два потока не удваивают темп,
  # а убирают простой на хвосте — фетчей дольше 1.6 с в замере **2.0 %** (p99 2 356 мс).
  # Ускорение от параллелизма объявлено, но не измерено.
  #
  # strategy: hybrid — ЗАМЕР 27.11.2026 (scripts/measure_hybrid_hosts.py, 6 URL ключа):
  # мост 6/6, браузерных прогрева 1, челленджей 0, текст 1.00 от honest-рендера того же
  # адреса (побайтово те же символы). wait_for остаётся: он нужен прогреву (JS-challenge
  # перезагружает страницу ПОСЛЕ domcontentloaded), а лёгкий GET условия ждать не может —
  # либо отдаёт материал, либо челлендж, который снимает подтверждение и стоит одного
  # пере-прогрева.
  # Замер: docs/reports/measurements/2026-11-27-hybrid-hosts.md.
  browser_workers: 2
  extract: auto
  fetch: browser
  max_depth: 8
  max_documents: 3500
  rate_limit:
    max_s: 3.0
    min_s: 0.2
  sitemap: https://pangolin.sbertech.ru/sitemap.xml
  strategy: hybrid
  wait_for: () => document.body && document.body.innerText.length > 200
# Оси хоста platformv.sbertech.ru **не однородны по пути** — измерено 29.10.2026, поэтому
# профиль расщеплён: ключ профиля — `host[/path]`, побеждает самый длинный path_key
# (`core/pipeline/fetch_plan.py:71-109`). Порядок ключей в файле — сортированный: файл
# сверяется с `yaml_dump(build_domain_profiles())` (sort_keys=True) тестом
# `tests/packages/test_build_package.py`, поэтому host-ключ идёт первым.
platformv.sbertech.ru:
  # Остальной хост: 401 обычному HTTP (антибот) ⇒ browser + honest. Бюджет 300.
  # Корней этого пакета на префиксе нет с 26.11.2026: маркетинговая страница
  # `/products/rabota-s-dannymi/pangolin/` выведена из объявленного корпуса (решение
  # владельца — это не документация редакции), а дерево документации живёт на
  # path-ключе ниже. Ключ оставлен как оси для адресов, которые discovery может
  # встретить на хосте, и как объявление браузерного профиля хоста.
  #
  # Sitemap намеренно не задан. Замер 29.10.2026: host-wide sitemap — 816 <loc>, из них
  # под /docs/public/PSQ/ **ноль** (дерево документации в карту не входит), поэтому
  # sitemap — no-op плюс запись об отказе на каждом прогоне.
  extract: auto
  fetch: browser
  max_depth: 8
  max_documents: 300
  strategy: honest
platformv.sbertech.ru/docs/public/PSQ:
  # Дерево документации PSQ. Версия выбирается корнем в `corpus_urls.yaml` (сейчас
  # 8.3.0 — редакция из паспорта), а не префиксом профиля: этот ключ описывает оси, не scope.
  # `fetch: http` — измерено: страницы документации отдают 200 обычному HTTP (проверено на
  # `/PSQ/8.1.0/`, `/PSQ/8.1.0/common/` и глубокой странице раздела, и повторно 26.11.2026
  # на `/PSQ/8.3.0/`, `/PSQ/8.3.0/index.html`, `/PSQ/8.3.0/common/` и глубокой странице
  # `…/administration-guide/pangolin-tuner.html` — все 200), тогда как маркетинговый
  # корень того же хоста — 401. Антибот на хосте не означает антибот на каждом пути хоста.
  extract: auto
  fetch: http
  max_depth: 8
  # Историческая нижняя оценка (замер 29.10.2026, дерево версии 8.1.0 —
  # той, что объявлена в паспорте: `version: Pangolin 8.1`):
  #   нижняя граница 1299 страниц = сумма ссылок 15 разделов
  #   `common/documents/<sec>/index.html` (about 12, administration-guide 113,
  #    architecture-components 254, description-of-functionality 99, developer-guide 10,
  #    distribution-kit 4, extensions 127, glossary 17, installation-guide 44,
  #    instructions-and-notes 12, programming-guide 222, reference-guide 50,
  #    reference-guide-postgresql 123, reference-guide-sql 206, what-is-new 6).
  # Выборочная проверка страниц даёт ещё несколько ссылок (перекрёстные), то есть 1299 —
  # нижняя граница, а не итог.
  #
  # Размер ИЗМЕРЕН 09.11.2026 на дереве **8.1.0** (изолированный стенд, бюджет 20000):
  # `crawl run --crawl-only --run-id recon-psq810 --from-scratch` ⇒ **1 155 документов**,
  # `truncated: false` (фронт исчерпан). Статический BFS того же дерева — 1 159 адресов;
  # разница 4 — страницы, схлопнутые по `content_hash`. Статическая сумма 1 299 была
  # завышена перекрёстными ссылками: страницы соседних разделов считались дважды.
  #
