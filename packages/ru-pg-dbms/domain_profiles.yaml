  # соседней версии той же структуры (15 разделов, тот же генератор документации) и выше
  # её измерения на 30 %. Это заявка на запас, а не на размер: точный предел объявит
  # `hound crawl drain --apply` после исчерпания корня.
  # Замер: `docs/reports/measurements/2026-11-09-root-size-recon.md` §1.
  max_documents: 1500
  # Лимит измерен 07.11.2026 (тираж): 200 документов на `{0.05, 0.2}` = **6.48 запроса/с**,
