- anchor_relation: analog
  comparison_base: true
  product_id: postgresql
  role_overlap: 0.8
  selection_reason: >-
    Предок линии, нуль отсчёта: Δ к нему показывает, что продукт добавляет к PostgreSQL.
    `analog`, а не новый член `AnchorRelation`: якорь у когорты уже один, а объявленная
    роль предка — не якорь, а база сравнения (`comparison_base`). Перекрытие ролей — из
    четырёх ролей профиля (`backup_recovery`, `core_engine`, `management_platform`,
    `migration`) предок закрывает `core_engine` полностью, `migration` и
    `backup_recovery` частично (`pg_dump`/`pg_basebackup`/`pg_upgrade`), а
    `management_platform` — не закрывает вовсе; по объявленным весам модулей пакета
    (core 0.58, backup 0.19, management 0.23) это ≈0.8.
