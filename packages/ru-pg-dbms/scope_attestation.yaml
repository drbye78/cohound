procedure: 'Человеческая аттестация охвата ПУБЛИЧНО ДОСТУПНОЙ документации продукта (I2b).

  Что эксперт делает. Для каждого продукта когорты перечисляет на зафиксированную дату
  snapshot_date все публично доступные носители сведений о продукте, которые он смог
  установить: разделы документации вендора (administration guide, reference, release notes),
  даташиты и сертификаты, страницы описания применения, а также хосты вендора, найденные
  поиском, а не только объявленные seeds. Затем проверяет, что среди них нет умолчанного
  носителя заявленного механизма.

  Что означает подпись. Подписывая scope_attested_by, эксперт утверждает: охват
  перечисленных ПУБЛИЧНО ДОСТУПНЫХ источников исчерпывающий на дату snapshot_date, и
  заявленной возможности в них нет. Подпись НЕ утверждает исчерпывающость дистрибутива:
  закрытые разделы, платные поставки и внутренние регламенты в неё не входят и не могут
  входить — coHound работает только с публичными сайтами (§10).

  Отказы источника не отменяют подпись, но обязаны быть названы. Если часть носителей
  недоступна (robots.txt запрещает обход, требуется авторизация, ресурс недоступен), эксперт
  перечисляет их в поле notes своей аттестации и подтверждает охват того, что реально
  наблюдаемо. Отказ источника фиксируется прогоном видимо (corpus_coverage.blocked_json), а
  не замалчивается: подпись при неполном покрытии — это заявление «я знаю, чего не видел»,
  а не «я всё видел».

  Границы. Для параметров, описывающих возможности ДРУГОГО класса продукта (например,
  backup-апплаенса того же вендора), подпись не выдаётся: исчерпывающий охват документации
  СУБД там нерелевантен по построению, и такие ячейки остаются ❓ до решения о scope каталога.

  Без подписи. Отсутствие записи в attestations означает, что охват не аттестован: ❌ по
  distribution_absence не публикуется, а честный ответ оценщика («в переданных фрагментах
  этого нет») становится pending-кандидатом с review_reason=absence_unattested. Решение
  принимает человек (I6/I7), и оно видно в очереди ревью, а не растворяется в отчёте.'
