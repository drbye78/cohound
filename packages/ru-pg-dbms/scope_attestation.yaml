procedure: 'Человеческая процедура аттестации полноты дистрибутива/документации (I2b):
  для каждого продукта когорты ответственный эксперт перечисляет все поставляемые
  компоненты и разделы документации (release notes, administration guide, reference)
  на зафиксированную дату snapshot_date; проверяет, что среди них нет умолчанного
  носителя заявленного механизма, и подтверждает исчерпывающий охват источником (source_scope=exhaustive)
  личной подписью scope_attested_by в листе аттестации пакета. При невозможности подтвердить
  полноту источник используется с source_scope=partial и не даёт права на ❌ по distribution_absence.'
