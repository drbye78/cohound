procedure: 'Человеческое ПРИНЯТИЕ РИСКА по охвату ПУБЛИЧНО ДОСТУПНОЙ документации продукта
  (Вариант 2 §2.3; прежнее имя подписи — scope_attested_by).

  Что эксперт делает. Для каждого продукта когорты перечисляет на зафиксированную дату
  snapshot_date все публично доступные носители сведений о продукте, которые он смог
  установить: разделы документации вендора (administration guide, reference, release notes),
  даташиты и сертификаты, страницы описания применения, а также хосты вендора, найденные
  поиском, а не только объявленные seeds. Затем проверяет, что среди них нет умолчанного
  носителя заявленного механизма.

  Что означает подпись. Подписывая scope_acceptance, эксперт принимает риск: охват
  перечисленных ПУБЛИЧНО ДОСТУПНЫХ источников он считает достаточным на дату snapshot_date,
  и заявленной возможности в них нет. Это принятие риска, а НЕ улучшение измерения: подпись
  не делает охват полным и не участвует в идентичности прогона (в execution_contract её нет).

  Где подпись вообще нужна. Только там, где измерение не покрывает пространство: класс
  отрицания bounded (параметры с объявленным конечным справочником: parameter_reference,
  distribution_absence). Прямое отрицание вендора с цитатой (класс explicit) в подписи НЕ
  нуждается: это свидетельство, а не вывод из полноты корпуса. Реестровая пустота
  (authoritative) тоже не нуждается. Неполный охват без сильного отрицания даёт класс
  unobserved и статус ❓ — подпись его в ❌ не превращает, и это правильно: ❓ остаётся в
  карте, а неподписанное «нет» уезжало бы в неё как факт.

  Отказы источника не отменяют подпись, но обязаны быть названы. Если часть носителей
  недоступна (robots.txt запрещает обход, требуется авторизация, ресурс недоступен), эксперт
  перечисляет их в поле notes своей аттестации и подтверждает охват того, что реально
  наблюдаемо. Отказ источника фиксируется прогоном видимо (corpus_coverage.blocked_json и
  вектор охвата cells.evidence_scope), а не замалчивается: подпись при неполном покрытии —
  это заявление «я знаю, чего не видел», а не «я всё видел».

  Границы. Для параметров, описывающих возможности ДРУГОГО класса продукта (например,
  backup-апплаенса того же вендора), подпись не выдаётся: охват документации СУБД там
  нерелевантен по построению, и такие ячейки остаются ❓ до решения о scope каталога.

  РЕШЕНИЕ ВЛАДЕЛЬЦА 2026-10-28 (переопределяет границу выше для продукта jatoba).
  Подпись jatoba выдана на ВСЕ 119 параметров, включая модуль backup. Почему граница
  снята, а не забыта: backup-апплаенс в корпусе jatoba не представлен ни одним документом,
  поэтому 44 параметра модуля (вес 0.19) оставались бы ❓ бессрочно — по процедурной
  причине, а не по наблюдению. Это решение о scope, а не измерение: оно не делает охват
  полным и не участвует в идентичности прогона. Решение записано здесь, а не только в
  notes подписи, потому что процедура и подпись в одном файле не имеют права говорить
  разное. Ненаблюдаемое по backup-модулю (ноль носителей) названо в notes подписи.

  Без подписи. Отсутствие записи в attestations означает, что риск не принят: параметры с
  объявленным конечным справочником получают ❓ с причиной absence_unattested (а не ❌ и не
  failed). Решение принимает человек (I6/I7), и оно видно в очереди ревью, а не растворяется
  в отчёте.'

# Подписи (Вариант 2). Ниже — единственная запись пакета на 2026-10-28.
#
# Область подписи — ВСЕ 119 параметров продукта, включая модуль backup (вес 0.19).
# Это осознанно: procedure выше запрещает выдавать подпись для возможностей другого
# класса продукта (backup-апплаенс того же вендора), и решение владельца от 2026-10-28
# этот запрет для jatoba СНИМАЕТ — риск принимается и по backup-модулю (WORM, air-gap,
# глобальная дедупликация, tiering). Причина названа: в корпусе jatoba backup-апплаенс
# не представлен НИ ОДНИМ документом, и без подписи все 44 параметра модуля остаются ❓
# бессрочно, превращая треть карты в «неизвестно» по процедурной причине, а не по факту.
#
# Что подпись НЕ делает: она не делает охват полным и не участвует в идентичности
# прогона (в execution_contract её нет), поэтому её добавление не меняет run_id.
attestations:
  - product_id: jatoba
    attested_by: Roger
    attested_at: '2026-10-28T00:00:00+00:00'
    snapshot_date: '2026-10-28'
    notes: >-
      Принятие риска по всему каталогу продукта (119 параметров: модули core, backup,
      management). Наблюдённый охват на дату снимка: корпус прошлого прогона — 54 документа
      на jatoba.ru и 2 на www.gaz-is.ru; www.gaz-is.ru отказал robots.txt на 17 из 28 URL
      (Disallow: *.pdf$), из-за чего corpus_coverage.complete = 0 при observed_sources = 11
      из 28. Ненаблюдаемое перечислено, а не умолчано: (1) PDF-раздел www.gaz-is.ru закрыт
      robots.txt — обход не выполнялся, это отказ источника, а не отсутствие материала;
      (2) документация backup-апплаенса в публичном корпусе отсутствует целиком (0
      документов) — по ней риск принят решением владельца отдельно, см. комментарий выше;
      (3) самостоятельный поиск (SERP) на момент подписи ещё исполняется, поэтому хосты
      вендора, найденные поиском, а не объявленные seeds, в охват этой подписи не входят.
      Подпись авторизует публикацию ❌ класса bounded: «искали и не нашли» относится к
      перечисленному охвату, а не к «мы всё видели».
