# coHound — CI на GitHub Actions.
#
# Провайдер здесь **не** второй набор гейтов: `scripts/ci.sh` остаётся единственной точкой
# входа (регламент §11.6, ADR 04 §C.1), а этот файл только готовит окружение и вызывает его.
# Поэтому локальный прогон и прогон на раннере проверяют одно и то же; расхождение между ними
# означало бы, что гейт зависит от машины.
#
# Что этот workflow добавляет к локальному прогону (и почему это стоит минуты раннера):
#   * чистое окружение из `uv.lock` (`--frozen`): необъявленная зависимость, которую на
#     рабочем хосте закрывает вручную поставленный extra, здесь видна как провал;
#   * независимое железо: рабочий хост — слабая общая машина под 7 GiB, где полный прогон
#     ограничен памятью (`-n auto` = OOM), а не ядрами; число воркеров здесь не подгоняется
#     под чужую RAM;
#   * прогон по коммиту, а не по рабочему дереву: «зелено локально» перестаёт быть
#     единственным родом доказательства.
#
# Набор extras **измерен**, а не выведен из названий. Окружение `extract` без `extract-pdf`
# уже роняет `selfcheck`: docling без OCR-движка отказывается работать на `document_level=full`
# (отказ верный — «не выдавать текст без OCR за full»), но гейт от этого красный. Поэтому
# `extract-pdf` здесь стоит, хотя тяжёлые PDF-тесты всё равно скипаются без
# `COHOUND_RUN_DOCLING_LEVELS=1`: он нужен не тестам, а тому, что объявленный адаптер обязан
# быть рабочим.
#
# Цена измерена (два зелёных прогона, 04.11.2026): job целиком **2m48s и 3m07s**, `uv sync
# --frozen` + `ruff` + `mypy` + якоря + `selfcheck` + `pytest` (4 воркера, 6521 passed,
# 8 skipped, 63–85 с). Окружение занимает 6.4 GiB (из них `nvidia-*` 3.2 и `torch` 1.2), на
# раннере 80 GiB свободного диска — места хватает без чистки. Кэш uv поэтому **выключен**:
# он добавил бы перенос ~3.8 GiB ради секунд, которых у прогона нет в дефиците.
#
# Два теста, которые на рабочем хосте исполняются, здесь **скипаются**: они читают живой
# прогон (`COHOUND_LIVE_RUNS_DIR`), а на раннере такого каталога нет. Это разница среды,
# а не «зелено на меньшем»: сами проверки живого прогона остаются хостовыми.
#
# Устройство извлечения — тоже объявление, а не вывод из окружения (R5): профиль хоста
# объявляет `cuda`, у раннера карты нет, поэтому шаг «Объявить устройство раннера» правит
# **чекаут** на `cpu`. Без этого первый прогон дал 44 упавших e2e-теста CLI: они падали не
# на логике, а на честном отказе «cuda без устройства».
#
# Чего здесь сознательно НЕТ:
#   * `ruff format` — форматирование в проекте выключено намеренно (pyproject §ruff);
#   * живой краул и `core.cli run`: они ходят в сеть и требуют объявленных входов;
#   * `scripts/conformance_pandoc.py` — оракул зависит от версии pandoc (базлайн 2.17.1.1),
#     а в раннере ставится другая; расползшееся расхождение читалось бы как регрессия чанкера;
#   * расписание (`schedule`). Cron на публичном репозитории умирает от «зелёного», когда
#     меняется окружение раннера, и приучает игнорировать красное. Запуск — push/PR/руками.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Секретов нет, и они не появятся: гейты проверяют код, а не разговаривают с внешним миром.
permissions:
  contents: read

# Новый push в ту же ветку отменяет предыдущий прогон: проверять надо последний коммит.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: ruff + mypy + anchors + selfcheck + pytest
    # Публичный раннер: 4 vCPU, 16 GiB RAM, ~14 GiB свободного диска.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Полная история не нужна: гейты читают рабочее дерево, а не прошлое.
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Python — объявленный базлайн проекта (`requires-python = ">=3.14"`), а не «что
          # стоит на раннере». uv скачивает CPython и ставит его в PATH.
          python-version: "3.14"
          # Кэш загрузок выключен: прогон и без него укладывается в 3 минуты, а перенос
          # ~3.8 GiB кэша стоил бы сопоставимо с самим прогоном (см. шапку файла).
          enable-cache: false

      - name: Окружение из зафиксированного lock
        # `--frozen` — это и есть гейт: если `pyproject.toml` и `uv.lock` разошлись, шаг
        # падает. Без `crawl`/`extract`/`extract-archives` тесты скипаются через
        # `importorskip`, то есть «зелено» означало бы «проверено меньше».
        run: >
          uv sync --frozen
          --extra dev --extra retrieval --extra crawl --extra extract --extra extract-pdf
          --extra extract-archives --extra safety --extra ops --extra embed-lite

      - name: Объявить устройство раннера (правка чекаута, не репозитория)
        # `config/deploy.yaml` объявляет `crawl.pdf_device: cuda` — свойство **хоста**
        # исполнения (RTX 3050 на рабочей машине), а не свойство конвейера. У раннера
        # CUDA нет, и объявленный `cuda` даёт правильный видимый отказ
        # `EXIT_USAGE` — измерено первым прогоном: 44 e2e-теста CLI падали на старте.
        #
        # Тихая подмена устройства в коде запрещена (R5), поэтому устройство объявляется
        # здесь — там, где оно известно: на этом хосте это `cpu`. Файл правится в
        # эфемерном чекауте раннера; репозиторий и рабочая машина не меняются, рабочая
        # карта продолжает объявляться как `cuda`. `test -eq 1` превращает будущую смену
        # формы оси в видимый провал шага, а не в молчаливую правку мимо.
        run: |
          test "$(grep -c '^  pdf_device: cuda$' config/deploy.yaml)" -eq 1
          sed -i 's/^  pdf_device: cuda$/  pdf_device: cpu/' config/deploy.yaml
          grep -n 'pdf_device' config/deploy.yaml

      - name: Гейты и тесты (единая точка входа)
        # Скрипт сам выбирает число воркеров xdist по памяти/ядрам; здесь оно не задаётся,
        # чтобы локальное правило оставалось единственным.
        run: PYTHON=.venv/bin/python bash scripts/ci.sh
        env:
          # Тесты не должны зависеть от хостовых `.env`/раскладки; conftest ставит это сам,
          # здесь — на случай запуска скрипта в обход pytest.
          COHOUND_NO_DOTENV: "1"