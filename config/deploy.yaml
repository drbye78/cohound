# coHound — конфиг развёртывания (07 §7, 03 D.5).
#
# Отдельно от run.yaml: развёртывание ≠ методологический прогон.
# Профиль `local` (дефолт, A1) выполняет всё in-process и ИГНОРИРУЕТ секцию `edge.*`.
# Для профилей `split`/`split-hardened` обязателен `edge.base_url` и шов поднимается
# через application-layer firewall по протоколу /v1/* (07 §5).
#
# TLS: доверие через корпоративный CA; certificate pinning НЕ поддерживается
# намеренно — это не блокирует корпоративную TLS-инспекцию DLP/IDS (07 §8.1).
# Не коммитить секреты: `client_key` — путь к файлу ключа, сам ключ вне репозитория.
#
# LLM (`llm:`) — commodity/execution-слой (§7.4): две именованные слоты моделей
# (`cheap`/`flagship`), активная выбирается в рантайме (--llm-slot / COHOUND_LLM_SLOT).
# Endpoint — [OI]-совместимый API: производственный контур — **внутренний** корпоративный
# периметр. Стенд RnD намеренно ходит во внешний endpoint, и это ИСКЛЮЧЕНИЕ ОБЪЯВЛЕНО ниже
# (`llm.rnd_endpoint: true`, регламент §10, блок «Исключение: стенд RnD»): без объявления
# внешний хост неотличим от ошибки конфигурации. Секрет (api_key) берётся из env
# (COHOUND_LLM_API_KEY), в YAML его нет.

profile: local                 # local | split | split-hardened

# --- Профиль split (раскомментировать при переходе на DMZ) -------------------
# edge:
#   base_url: "https://edge.internal:8443"
#   tls:
#     ca: certs/ca.pem                 # корпоративный CA (в т.ч. TLS break-and-inspect)
#     client_cert: certs/core.pem      # workload-identity ядра
#     client_key: secrets/core.key     # путь к ключу; сам ключ не коммитится
#   auth: mtls                         # mtls | oidc
#   # oidc: { issuer: "https://idp.corp/realms/x", audience: "cohound-edge" }  # если auth: oidc
#   timeout_s: 30
#   max_retries: 2
#   max_response_bytes: 52428800       # защита ядра от edge
#   audit: { sink: file, target: /var/log/cohound/audit.jsonl }  # SIEM-экспорт, §8.4

extractor_zone: core           # edge | core | separate

# --- Crawl (операционная политика; 07) ----------------------------------------
# Секция crawl действует в обоих профилях. Браузерный краулер — для SPA/JS-контента.
# crawl:
#   user_agent: coHound-crawler/0.1
#   timeout_s: 30
#   browser:                  # браузерный краулер (honest/hybrid); см. docs/architecture/07
#     mode: cdp               # cdp | persistent
#     cdp_url: http://127.0.0.1:9222
#     headless: false
#
crawl:
  # Устройство моделей извлечения PDF (P9, `10` §3.4–3.6). Здесь, а не в run.yaml
  # пакета: устройство принадлежит **хосту исполнения**, а не измерению продукта, и
  # per-site слоя у оси нет намеренно. Значения только `cpu` | `cuda` — `auto` не
  # существует (R5: объявленная ось обязана действовать).
  #
  # `cuda` на этом хосте: RTX 3050 Laptop 4 GB, `torch 2.14.1+cu130`. Замер
  # (`docs/reports/measurements/2026-10-28-gpu-vs-cpu-extraction.md`): 8.45–11.73× на
  # документной экстракции против одного CPU-воркера; 665-стр. документ — 113–121 с
  # вместо 989.6 с. Окно под `cuda` выходит 1 воркер: второй на одной карте даёт 1.10×
  # при +2.3 GB host-RSS (карта насыщена), и это следствие замера, а не потолок.
  #
  # Цена объявления: на хосте **без** CUDA прогон отказывает с числами (`EXIT_USAGE`:
  # версия torch, `cuda_available`, объём карты), а не подменяет устройство молча.
  # Перенос этого файла на CPU-хост — правка одной строки на `cpu`.
  pdf_device: cuda
  # Уровень извлечения остаётся в run.yaml пакета (`document_level: layout_tables`):
  # это условие измерения, а не свойство машины.
  #
  # Сетевой пул воркеров краула (`CrawlLimits.max_workers`) — тоже свойство УЗЛА, как
  # `host_concurrency` и `pdf_device`, поэтому объявлено здесь, а не в run.yaml пакета:
  # у ≥100 профилей не должно быть по копии числа, привязанного к этой машине. Разрешение
  # app < run < site не меняется; значение входит в `crawl_config_digest`
  # (`CrawlLimits.as_dict`), поэтому смена числа — по-прежнему `execution_change` с новым
  # `run_id`, а не тихая правка (решение владельца 07.11.2026).
  #
  # Почему 10, а не 3. Прежние 3 — число без замера. При `rate_limit` 1–5 с на origin
  # темп задаёт лимитер, а не пул: потоки нужны ровно чтобы держать
  # `in_flight ≈ latency / delay`, иначе пайп недозаполнен и хост простаивает между
  # слотами. 10 — не «побольше», а рабочая ширина, при которой упор гарантированно
  # приходится в лимитер, а не в пул. Цена: ≤10 одновременных ответов по
  # `max_response_bytes` (20 MiB) ≈ 200 MiB RAM, потоки — единицы МБ; экстракция имеет
  # свой пул (`extract_workers`) и от этой оси не зависит.
  #
  # Число подлежит проверке замером: пик `in_flight` по хосту публикует прибор
  # (`metrics.json`, блок `crawl`). **Проверено 07.11.2026** (лестница на
  # `docs.tantorlabs.ru`, `docs/reports/measurements/2026-11-07-crawl-rate-tantor.md` §9):
  # при фиксированном лимите ширина пула 1/2/5 даёт 1.87/2.20/2.40 запроса/с, то есть пул
  # перестаёт быть узким местом начиная с 5; пик `in_flight` на хост — 1 при `{0.2,0.5}` и
  # 2–3 при `{0.05,0.2}` (интервал 0.13 с против ответа 0.11 с). Критерий «пик ≤ 3 ⇒
  # вернуть 3» относится к **одному** хосту: полос пять, и 5 × 3 = 15 желаемых ответов
  # в полёте против пула 10 — число остаётся 10, иначе пул снова станет потолком узла.
  max_workers: 10
  # Сколько ХОСТОВ узел ведёт одновременно (число полос). Не объявлено ⇒ 1:
  # `corpus_driver.py:245` (`lanes_limit = 1 if host_concurrency is None`), то есть хосты
  # обходятся строго по одному, и стена краула = СУММА времён хостов.
  #
  # Число взято из замера, а не из желания: durable-данные прогона
  # `ru-pg-dbms-208472049479` (11 074 фетча, чтение 07.11.2026, **до** исправления
  # скрытого пейсера) — медианный интервал между запросами 4.0 с на каждом хосте
  # (лимитер), `fetch_ms` p50 0.4–1.3 с, p95 0.7–4.2 с, отсюда требуемая конкурентность
  # `in_flight ≈ p95/интервал` = 0.1–1.0 на хост. Сумма времён хостов ≈ 12.9 ч против
  # 5.6 ч у самого длинного, то есть полосы — единственный рычаг, который реально
  # сокращает окно; ширина пула внутри полосы (max_workers) его не двигает.
  #
  # **Что изменилось после исправления 07.11.2026** (`c81f74b`, `…crawl-rate-tantor.md`
  # §9): у `docs.tantorlabs.ru` измерены 5.78 запроса/с и **весь** корень — 1207
  # документов за 209 с (прежние «5.6 ч» складывались из бюджета 5000 и скрытой задержки
  # 1.3 с на документ, а не из объёма). Остальные http-хосты пока объявляют
  # `rate_limit` 1–5 с, поэтому для НИХ арифметика полос прежняя, пока тираж (план 22 §9)
  # не измерит их по одному; переносить число tantor на них запрещено (AGENTS §1.1).
  #
  # Цена: до `host_concurrency × max_workers` = 50 потоков, худший случай по памяти
  # 5 × 10 × `max_response_bytes` (20 MiB) = 1 GB, типичная страница ~100 KB. Each host
  # остаётся под своим `rate_limit` (1–5 с) — вежливость задаёт лимитер, а не число полос.
  # Значение входит в `crawl_config_digest` ⇒ смена = новый `run_id` (решение владельца
  # 07.11.2026: пять полос).
  host_concurrency: 5

# Эмбеддер: устройство — ось контракта (`embed.device` в
# `EXECUTION_CONTRACT_FIELDS`), поэтому объявляется здесь, а не выбирается
# библиотекой. Замер 06.11.2026 на этом хосте (bge-m3, 256 текстов ≈ 600 симв.):
# cuda — 14.44 чанк/с при пике VRAM 2.51 GB из 4.10 GB, cpu — 1.59 чанк/с (×9.1).
# `auto` не существует (R5): на хосте без CUDA прогон отказывает с числами
# (`require_embed_device`), а не подменяет устройство молча. На `cuda`
# `LiteEmbedder` (model2vec, NumPy/CPU by design) исключается с видимой заметкой.
embed:
  device: cuda
  # Точность счёта вектора (ось `embed.precision`, `EXECUTION_CONTRACT_FIELDS`).
  # Решение владельца 06.11.2026 — fp16. Замер
  # `docs/reports/measurements/2026-11-06-embedding-precision-cpu.md` (cuda, bge-m3):
  # 15.40/13.82 чанка/с против 6.02/4.99 у fp32 (2.6×), худший чанк `1−cos` 8.3e-05,
  # top-10 соседей 0.998, детерминизм побитовый (`max|Δ| = 0.0`). bf16 отвергнут тем же
  # замером (`1−cos` 7.5e-04 при той же скорости), tf32 — 9.6e-05 при 1.26–1.39×.
  # `auto` не существует (R5): объявленная точность обязана доехать до провода
  # (`torch.autocast`), а эмбеддер, который её не исполнит (LiteEmbedder/NumPy), —
  # отказ с числами, а не тихий fp32.
  precision: fp16

search:
  adapter: yandex              # провайдер по умолчанию (--search-adapter переопределяет)
  # Дифференциация по языку/географии (опционально; I16: маршрут — функция от lang,
  # одинаков для всех продуктов). Пример:
  # by_language: { ru: yandex, en: glm }
  # SERP-контур (I3/§5): НИЗШИЙ уровень переключения. Приоритет:
  # --serp-rounds > COHOUND_SERP > run.yaml: serp.rounds > этот ключ > 0 (выключен).
  # Бюджета здесь нет: он объявляется в run.yaml: serp.budget, потому что определяет
  # число ушедших запросов, то есть состав корпуса (и run_id). Прежний ключ
  # search.budget { ru: 5, en: 5 } удалён: он ключевался по языку, а фактический
  # потребитель (SearchBudget) — по фазе, и не ограничивал ничего (тихий безлимит).
  serp:
    rounds: 0

# --- LLM (commodity/execution-слой; 07 §7 / 03 D.5) --------------------------
# Две именованные слоты моделей; активная выбирается в рантайме. Оба слота указывают на
# одну модель `deepseek-v4.1-flash-1017:yellow` — это ПРОВИЗОРНЫЕ данные (идентификатор,
# который используется сегодня), а не решение: финальный выбор модели оценщика даёт измерение
# `hound experiment evaluator-benchmark` (A3). Смена model_id слота — версионная граница
# `execution_versions` (execution_change, §13): меняется run_id, methodology_version — нет.
# Вариант `-1017:yellow` объявлен владельцем 06.11.2026; он проверен живым вызовом
# (модель отвечает, `usage.completion_tokens_details.reasoning_tokens` и
# `message.reasoning_content` отдаются — иначе ось усилия было бы нечем мерить).
# base_url пустой → слот не активен (оценщик не поднимается; llm_scenarios пуста).
# Модели обслуживаются OI-совместимым API корпоративного облака (не self-host). Ключ — из env.
# Env COHOUND_LLM_MODEL/_DECODER оценщиком НЕ читаются (только LLM-разведка): модель оценщика —
# объявленный вход (этот слот или --llm-model), см. 03 §D.6.
llm:
  slot: cheap                 # активный slot: cheap | flagship (--llm-slot / COHOUND_LLM_SLOT переопределяют)
  # Стенд RnD вне корпоративного периметра (объявлено владельцем 2026-10-28, §10).
  # null — не объявлено (тогда прогон печатает замечание rnd_endpoint_not_declared);
  # false — объявлено «внутри периметра» (производственный контур); true — стенд.
  # Признак виден в профиле публикуемости (outputs/publishability.yaml + манифест) и в
  # шапке battle card: карта со стенда НЕ является производственной публикацией.
  # На run_id не влияет: место исполнения — декларация, а не условие измерения.
  rnd_endpoint: true
  cheap:
    # Endpoint объявлен здесь, а НЕ только в env: llm_scenarios входит в
    # execution_contract_digest → run_id (§7.4, I21). Пустой base_url при непустом
    # env-значении даёт прогон, где оценщик работает, а run_id этого не описывает —
    # вердикты не воспроизводимы. Значение — внешний OI-совместимый API dev-среды
    # (замер моделей на одном endpoint, Д-36); в корпоративном периметре здесь
    # внутренний адрес. Секрет (api_key) остаётся в env: COHOUND_LLM_API_KEY.
    base_url: "https://plusvibeapi.ru"
    # Решение владельца 06.11.2026: оценщик — `deepseek-v4.1-flash-1017:yellow`.
    # Вариант модели — объявленный вход (llm_scenarios → run_id): смена варианта даёт
    # новый run_id, старый прогон остаётся с тем, на чём считался.
    model_id: "deepseek-v4.1-flash-1017:yellow"
    model_version: ""
    decoder: json_object      # none | json_object | json_schema
    # Решение владельца 06.11.2026: потолок 16 384. Арифметика, а не догадка: модель
    # reasoning (thinking-токены списываются из того же потолка), замер прогона
    # ru-pg-dbms-c2e7b860ac17 — ~1 456 completion-токенов за 16.6 с ≈ 88 ток/с, значит
    # 16 384 токена ≈ 186 с. Таймаут ниже потолка резал бы ответ клиентом, а не сервером,
    # и отказ выглядел бы как http_error вместо finish_reason=length. Потолок — условие
    # измерения (в llm_scenarios), таймаут — операционный (в run_id не входит).
    timeout_s: 300
    max_tokens: 16384
    # Уровень рассуждения объявлен явно и постоянным (решение владельца 07.11.2026):
    # выбранная модель указание уровня **игнорирует**, это её известное свойство, а не
    # результат нашего замера. Замерено (2026-11-07-evaluator-benchmark-first-kappa.md,
    # 50 ячеек): `off` и `low` дают один и тот же объём рассуждения (1558 против 1509
    # токенов), рассуждение присутствует в 50 из 50 ячеек и при `off`. Значение `off`
    # означает «параметр не отправляется»; смена уровня на модели, которая его чтит,
    # по-прежнему даёт новый `run_id` (уровень внутри `llm_scenarios`), и это правильно:
    # там он меняет поведение. Кавычки обязательны: YAML 1.1 читает `off` как boolean
    # (проверено — pydantic ругается `input_value=False`).
    reasoning_effort: "off"
  flagship:
    base_url: ""
    model_id: "deepseek-v4.1-flash-1017:yellow"
    model_version: ""
    decoder: json_object
    timeout_s: 120
    max_tokens: 4096
