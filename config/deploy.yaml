# coHound — конфиг развёртывания (07 §7, 03 D.5).
#
# Отдельно от run.yaml: развёртывание ≠ методологический прогон.
# Профиль `local` (дефолт, A1) выполняет всё in-process и ИГНОРИРУЕТ секцию `edge.*`.
# Для профилей `split`/`split-hardened` обязателен `edge.base_url` и шов поднимается
# через application-layer firewall по протоколу /v1/* (07 §5).
#
# TLS: доверие через корпоративный CA; certificate pinning НЕ поддерживается
# намеренно — это не блокирует корпоративную TLS-инспекцию DLP/IDS (07 §8.1).
# Не коммитить секреты: `client_key` — путь к файлу ключа, сам ключ вне репозитория.
#
# LLM (`llm:`) — commodity/execution-слой (§7.4): две именованные слоты моделей
# (`cheap`/`flagship`), активная выбирается в рантайме (--llm-slot / COHOUND_LLM_SLOT).
# Endpoint — [OI]-совместимый API: производственный контур — **внутренний** корпоративный
# периметр. Стенд RnD намеренно ходит во внешний endpoint, и это ИСКЛЮЧЕНИЕ ОБЪЯВЛЕНО ниже
# (`llm.rnd_endpoint: true`, регламент §10, блок «Исключение: стенд RnD»): без объявления
# внешний хост неотличим от ошибки конфигурации. Секрет (api_key) берётся из env
# (COHOUND_LLM_API_KEY), в YAML его нет.

profile: local                 # local | split | split-hardened

# --- Профиль split (раскомментировать при переходе на DMZ) -------------------
# edge:
#   base_url: "https://edge.internal:8443"
#   tls:
#     ca: certs/ca.pem                 # корпоративный CA (в т.ч. TLS break-and-inspect)
#     client_cert: certs/core.pem      # workload-identity ядра
#     client_key: secrets/core.key     # путь к ключу; сам ключ не коммитится
#   auth: mtls                         # mtls | oidc
#   # oidc: { issuer: "https://idp.corp/realms/x", audience: "cohound-edge" }  # если auth: oidc
#   timeout_s: 30
#   max_retries: 2
#   max_response_bytes: 52428800       # защита ядра от edge
#   audit: { sink: file, target: /var/log/cohound/audit.jsonl }  # SIEM-экспорт, §8.4

extractor_zone: core           # edge | core | separate

# --- Crawl (операционная политика; 07) ----------------------------------------
# Секция crawl действует в обоих профилях. Браузерный краулер — для SPA/JS-контента.
# crawl:
#   user_agent: coHound-crawler/0.1
#   timeout_s: 30
#   browser:                  # браузерный краулер (honest/hybrid); см. docs/architecture/07
#     mode: cdp               # cdp | persistent
#     cdp_url: http://127.0.0.1:9222
#     headless: false
#
crawl:
  # Устройство моделей извлечения PDF (P9, `10` §3.4–3.6). Здесь, а не в run.yaml
  # пакета: устройство принадлежит **хосту исполнения**, а не измерению продукта, и
  # per-site слоя у оси нет намеренно. Значения только `cpu` | `cuda` — `auto` не
  # существует (R5: объявленная ось обязана действовать).
  #
  # `cuda` на этом хосте: RTX 3050 Laptop 4 GB, `torch 2.14.1+cu130`. Замер
  # (`docs/reports/measurements/2026-10-28-gpu-vs-cpu-extraction.md`): 8.45–11.73× на
  # документной экстракции против одного CPU-воркера; 665-стр. документ — 113–121 с
  # вместо 989.6 с. Окно под `cuda` выходит 1 воркер: второй на одной карте даёт 1.10×
  # при +2.3 GB host-RSS (карта насыщена), и это следствие замера, а не потолок.
  #
  # Цена объявления: на хосте **без** CUDA прогон отказывает с числами (`EXIT_USAGE`:
  # версия torch, `cuda_available`, объём карты), а не подменяет устройство молча.
  # Перенос этого файла на CPU-хост — правка одной строки на `cpu`.
  pdf_device: cuda
  # Уровень извлечения остаётся в run.yaml пакета (`document_level: layout_tables`):
  # это условие измерения, а не свойство машины.

# Эмбеддер: устройство — ось контракта (`embed.device` в
# `EXECUTION_CONTRACT_FIELDS`), поэтому объявляется здесь, а не выбирается
# библиотекой. Замер 06.11.2026 на этом хосте (bge-m3, 256 текстов ≈ 600 симв.):
# cuda — 14.44 чанк/с при пике VRAM 2.51 GB из 4.10 GB, cpu — 1.59 чанк/с (×9.1).
# `auto` не существует (R5): на хосте без CUDA прогон отказывает с числами
# (`require_embed_device`), а не подменяет устройство молча. На `cuda`
# `LiteEmbedder` (model2vec, NumPy/CPU by design) исключается с видимой заметкой.
embed:
  device: cuda

search:
  adapter: yandex              # провайдер по умолчанию (--search-adapter переопределяет)
  # Дифференциация по языку/географии (опционально; I16: маршрут — функция от lang,
  # одинаков для всех продуктов). Пример:
  # by_language: { ru: yandex, en: glm }
  # SERP-контур (I3/§5): НИЗШИЙ уровень переключения. Приоритет:
  # --serp-rounds > COHOUND_SERP > run.yaml: serp.rounds > этот ключ > 0 (выключен).
  # Бюджета здесь нет: он объявляется в run.yaml: serp.budget, потому что определяет
  # число ушедших запросов, то есть состав корпуса (и run_id). Прежний ключ
  # search.budget { ru: 5, en: 5 } удалён: он ключевался по языку, а фактический
  # потребитель (SearchBudget) — по фазе, и не ограничивал ничего (тихий безлимит).
  serp:
    rounds: 0

# --- LLM (commodity/execution-слой; 07 §7 / 03 D.5) --------------------------
# Две именованные слоты моделей; активная выбирается в рантайме. Оба слота указывают на
# одну модель `deepseek-v4.1-flash:purple` — это ПРОВИЗОРНЫЕ данные (идентификатор, который
# используется сегодня), а не решение: финальный выбор модели оценщика даёт измерение
# `hound experiment evaluator-benchmark` (A3). Смена model_id слота — версионная граница
# `execution_versions` (execution_change, §13): меняется run_id, methodology_version — нет.
# base_url пустой → слот не активен (оценщик не поднимается; llm_scenarios пуста).
# Модели обслуживаются OI-совместимым API корпоративного облака (не self-host). Ключ — из env.
# Env COHOUND_LLM_MODEL/_DECODER оценщиком НЕ читаются (только LLM-разведка): модель оценщика —
# объявленный вход (этот слот или --llm-model), см. 03 §D.6.
llm:
  slot: cheap                 # активный slot: cheap | flagship (--llm-slot / COHOUND_LLM_SLOT переопределяют)
  # Стенд RnD вне корпоративного периметра (объявлено владельцем 2026-10-28, §10).
  # null — не объявлено (тогда прогон печатает замечание rnd_endpoint_not_declared);
  # false — объявлено «внутри периметра» (производственный контур); true — стенд.
  # Признак виден в профиле публикуемости (outputs/publishability.yaml + манифест) и в
  # шапке battle card: карта со стенда НЕ является производственной публикацией.
  # На run_id не влияет: место исполнения — декларация, а не условие измерения.
  rnd_endpoint: true
  cheap:
    # Endpoint объявлен здесь, а НЕ только в env: llm_scenarios входит в
    # execution_contract_digest → run_id (§7.4, I21). Пустой base_url при непустом
    # env-значении даёт прогон, где оценщик работает, а run_id этого не описывает —
    # вердикты не воспроизводимы. Значение — внешний OI-совместимый API dev-среды
    # (замер моделей на одном endpoint, Д-36); в корпоративном периметре здесь
    # внутренний адрес. Секрет (api_key) остаётся в env: COHOUND_LLM_API_KEY.
    base_url: "https://plusvibeapi.ru"
    model_id: "deepseek-v4.1-flash:purple"
    model_version: ""
    decoder: json_object      # none | json_object | json_schema
    timeout_s: 120
    max_tokens: 4096
  flagship:
    base_url: ""
    model_id: "deepseek-v4.1-flash:purple"
    model_version: ""
    decoder: json_object
    timeout_s: 120
    max_tokens: 4096
