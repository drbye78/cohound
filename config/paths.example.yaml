# coHound — пример раскладки операционных каталогов (03 §A.1).
#
# Скопируйте в `config/paths.yaml` и раскомментируйте нужное. Файл НЕ обязателен:
# без него действуют относительные дефолты (как ниже в закомментированных значениях).
#
# Приоритет для каждого поля:
#   CLI-флаг (explicit)  >  env COHOUND_<FIELD>_DIR  >  значение из этого файла  >  дефолт
#
# `home` — единый корень: все ОТНОСИТЕЛЬНЫЕ пути (дефолты/файл/env/CLI) считаются от него
# и становятся абсолютными; абсолютные пути остаются как есть. Без `home` пути
# относительны текущему рабочему каталогу (CWD).
#
# Пути — данные, не код: модуль только типизирует их и не создаёт каталоги.

# home: /var/lib/cohound        # единый корень раскладки (иначе путь от CWD)

# packages: packages            # операционные пакеты категорий (обычно versioned в git)
# passports: passports          # паспорта продуктов passports/{product_id}/{date}.yaml
# runs: runs                    # пакеты прогонов runs/{run_id}/ (БД, логи, outputs)
# index_store: index_store      # иммутабельные индексные сборки индекс-контура
# corpus_raw: corpus_raw        # retention сырых байтов страниц (content-addressed)
# cache: cache                  # глобальный content-addressed кэш (cache/serp, cache/http)
# extract_cache: extract_cache  # межпрогонный кэш экстракции (content-addressed, переживает runs/)
# reports: reports              # публикуемые артефакты вне runs/ (опционально)
#
# NB: реестровые спецификации — package-scoped (packages/{case_id}/registries/*.yaml),
# отдельного операционного каталога раскладки для них нет (03 §D.4).
