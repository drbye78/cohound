# coHound — словарь статусов и перечислений
# Источник истины по §4.1 регламента cohound-spec-v2.md.
# Версия словаря: 2.2.0
# Каталоги (package/catalog) версионируются отдельно; этот файл — их зависимость.
#
# КЛАССИФИКАЦИЯ СЕКЦИЙ (§13 регламента: класс энума — по семантике, не по файлу-носителю).
# Методологические (смена = версионная граница methodology_version): statuses,
# capability_scoring/partial_score, absence_rule_type, source_scope, evidence_type,
# satellite/rule_r2, comparability, run_mode, cell_state.
# Операционные (добавление значений НЕ требует бампа status_dictionary_version):
# crawl_*, archive_*, document_*, fetch_mode, extraction_route, seed_*, onboarding_state,
# product_mode, refresh_policy, product_scope, incremental_kind, reuse_kind, change_class,
# run_scope, skip_reason, stale_reason, search_phase, termination_reason, adapter_kind,
# endpoint_kind, llm_scenario, gate/gate_source/gate_verdict/gate_policy, golden_tier, cap,
# importance, param_type, archetype, anchor_relation, crawl_probe_*.
# Класс конкретной секции, где он неочевиден, помечен комментарием рядом с ней.
#
# ПРАВИЛО: операционные перечисления (напр. crawl_session_status/crawl_item_status,
# gate_source/gate_verdict/gate_policy) добавляются БЕЗ бампа этой версии.
# ПОБОЧНЫЙ ЭФФЕКТ, названный явно: status_dictionary_version — литерал в этом файле, а не
# content-addressed отпечаток содержимого. Значит, добавление операционного значения не
# меняет status_dict_version, а он входит в METHODOLOGY_FIELDS и в
# EXECUTION_CONTRACT_FIELDS. Это осознанно: иначе правка процедуры (напр. политики гейтов)
# меняла бы методологический отпечаток и рвала бы межцикловый diff. Цена: операционные
# значения не видны в контракте — их провенанс несут сами строки прогона
# (gate_decisions, crawl_sessions, …), а не версия словаря.

status_dictionary_version: "2.2.0"

# §2.1. Статусы ячейки. Порядок ординален: OK > PARTIAL > ABSENT.
# unknown (❓) — не отрицательное свидетельство; N/A — только человеком.
statuses:
  ok:
    symbol: "✅"
    ordinal: 3
    label_ru: "подтверждено"
    description: "Наличие подтверждено валидной цитатой или детерминированным выводом."
  partial:
    symbol: "⚠️"
    ordinal: 2
    label_ru: "частично/неполно подтверждено"
    description: "Наличие частично/неполно подтверждено либо реализовано ограниченно."
  absent:
    symbol: "❌"
    ordinal: 1
    label_ru: "подтверждённое отсутствие"
    description: "Отсутствие непосредственно подтверждено absence-evidence по absence-правилу параметра."
  unknown:
    symbol: "❓"
    ordinal: 0
    label_ru: "не установлено"
    description: "После исчерпания предписанного протокола недостаточно доказательств."
  not_applicable:
    symbol: "N/A"
    ordinal: -1
    label_ru: "неприменимо"
    description: "Архитектурно неприменим; устанавливается только человеком (I6, I7)."

# Разрешающий набор для числителя Resolved Capability (§6): ❓ вне числителя и знаменателя.
# N/A исключается человеком. failed — не статус вовсе (I4).
capability_scoring:
  ok: 1.0
  partial: 0.5
  absent: 0.0
  # unknown и not_applicable в числитель не входят.
partial_score: 0.5

# §4.1. source_kind — вид источника evidence.
source_kind:
  - registry
  - inheritance
  - distribution
  - documentation
  - web
  - manual

# §4.1. evidence_type — прямое, производное доказательство или протокол отсутствия.
# absence — законный вид (§4.2): у него нет цитаты (I22 к нему не применяется), а носитель —
# cell_evidence с evidence_type='absence'. Класс отрицания (denial_strength) живёт в
# EvidenceScope ячейки (cells.evidence_scope), а не в самой записи evidence.
evidence_type:
  - direct
  - derived
  - absence

# §4.2. absence_rule_type — тип правила отсутствия параметра.
# Дефолт catalog.csv — explicit.
absence_rule_type:
  default: explicit
  values:
    explicit: "Прямое отрицание/ограничение вендора с цитатой → denial_strength=explicit → ❌; без цитаты → not_stated → ❓."
    parameter_reference: "Конечный справочник: без прямого отрицания требует принятия риска (scope_acceptance) → bounded → ❌; иначе ❓."
    distribution_absence: "Конечный справочник: без прямого отрицания требует принятия риска (scope_acceptance) → bounded → ❌; иначе ❓."
    registry_absence: "Авторитетная энумерация → denial_strength=authoritative → ❌; принятие риска не требуется."
  # Вариант 2 §2.3: тип правила больше не задаёт отдельную блокировку (I2b). Он лишь
  # подсказывает, какой класс отрицания вообще достижим: explicit — всегда,
  # parameter_reference/distribution_absence — bounded (с принятием риска),
  # registry_absence — authoritative.
  denial_strength_reachable:
    explicit: [explicit]
    parameter_reference: [explicit, bounded]
    distribution_absence: [explicit, bounded]
    registry_absence: [authoritative]

# §4.1. source_scope — УСТАРЕВШИЙ скаляр прежних прогонов (persisted data).
# Новый писатель его не выставляет: вопрос «можно ли утверждать отсутствие» решает
# denial_strength + вектор охвата (EvidenceScope). Секция сохранена, чтобы словарь
# оставался зеркалом перечисления и старые строки читались без догадок.
source_scope:
  - exhaustive
  - partial
  - unknown

# §2.3 (Вариант 2). denial_strength — **один** ответ на вопрос «можно ли утверждать
# отсутствие». Заменяет три независимые блокировки (I2b «exhaustive + подпись», I2c
# «человеческая аттестация при неполном корпусе», I3 «полный протокол из четырёх контуров»).
# Класс — функция ПРОИСХОЖДЕНИЯ утверждения, а не его эмоциональной силы. Методологическая
# секция: смена значений — версионная граница methodology_version.
denial_strength:
  authoritative: "Авторитетная полная энумерация (реестр), записи нет → ❌."
  explicit: "Вендор прямо отрицает/ограничивает, есть цитата → ❌."
  bounded: "Конечный справочник с объявленной процедурой полноты + принятие риска → ❌ (слабее explicit)."
  unobserved: "Охват неполон/заблокирован (часть материала не наблюдалась) → ❓ + причина."
  not_stated: "Вендор не заявил, охват не доказан → ❓ + причина."
  instrument_failed: "Краул/экстрактор/ретривал/оценщик не смогли → failed (статуса нет, I4)."
  # Классы, при которых статус определён. Один маппинг: класс → статус.
  verdicts:
    authoritative: "❌"
    explicit: "❌"
    bounded: "❌"
    unobserved: "❓"
    not_stated: "❓"
    instrument_failed: "failed"
  # Классы, которые вправе заявить оценщик (Ш6). Авторитет и сбой прибора — не его.
  evaluator_can_claim: [explicit, not_stated]

# §7. denial_claim — что модель вправе заявить о своём «нет» (поле ответа LLMCellOutput).
# Ровно два значения: всё прочее — присвоение авторитета, которого у модели нет.
denial_claim:
  - explicit
  - not_stated

# §4.1. failure_kind — класс сбоя; failed никогда не статус (I4).
# Исходы краула (crawl_session_items.error_kind) — persisted-данные: строки стабильны.
# dlp_blocked/quarantined зарезервированы под egress-контур (08); extraction_timeout
# отделяет таймаут извлечения от прочих parser-сбоев.
failure_kind:
  - search_failed
  - source_unavailable
  # not_found — HTTP 404/410: успешное наблюдение отсутствия ресурса, не недоступность
  # источника; не делает origin нечитаемым и не влияет на complete (Ф0/I2c).
  - not_found
  - evaluation_failed
  - validation_failed
  - parser_failed
  - robots_disallow
  - attempts_exhausted
  - redirect_out_of_scope
  - dlp_blocked
  - quarantined
  - extraction_timeout
  # Осознанные границы исполнения (не блокируют complete, как exclude_documents):
  # потолок ответа crawl.max_response_bytes и бинарный не-документ (post-fetch sniff).
  - payload_too_large
  - unsupported_binary
  # MVP-1 (09 §6.4/§11.3): у продукта нет источников / отсутствует строка покрытия.
  # Это провал измерения (failed-ячейки), а не ❌ и не блокирующий класс корпуса.
  - no_sources
  - coverage_missing
  # Частичное извлечение: документ получен (элемент краула FETCHED), но прочитана лишь
  # часть страниц. Непрочитанное — ненаблюдённый материал ⇒ охват неполон (блокирующий
  # класс корпуса), иначе молчание страниц выдавалось бы за «вендор не заявил».
  - partial_extraction

# §4.1. cell_state — жизненный цикл ячейки.
# evaluated+status → разрешённая; failed → status=null (I4), в знаменателе Coverage (I5).
cell_state:
  - pending
  - preliminary
  - evaluated
  - failed
  - reviewed

# §1.4. run_mode — режим прогона.
run_mode:
  - strict
  - preliminary

# §4.1. Оси сателлита.
satellite:
  origin:
    - in_house
    - third_party
    - upstream
    - community
    - unknown
  relationship:
    - bundled
    - integrated
    - certified
    - recommended
    - external
  evidence_state:
    - verified
    - claimed

# §4.3. Состояние сателлита в паспорте.
satellite_state:
  - draft
  - approved
  - edited_by_human
  - not_found

# §4.2. Режим наследования (baselines.csv).
inheritance_mode:
  - direct
  - conditional
  - blocked

# §4.2. Тип параметра.
param_type:
  - fact
  - showcase

# §4.2. Важность параметра (лат. аббревиатуры по регламенту).
importance:
  - "Кр"
  - "Вж"
  - "Баз"
  - "Опц"
importance_labels:
  "Кр": "критический"
  "Вж": "важный"
  "Баз": "базовый"
  "Опц": "опциональный"

# §4.2. Архетип категории.
archetype:
  - A
  - B
  - C

# §1.6. Связь продукта с якорем когорты.
anchor_relation:
  - anchor
  - analog

# §7.4 / §4.4. Роль LLM-сценария и вид эндпоинта.
llm_scenario:
  - evaluator
  - search_adapter
  - discovery
  - concept_scout
endpoint_kind:
  - self_host
  - api
adapter_kind:
  - serp
  - llm_grounding

# §4.4/§7.4. Вид поискового лога (S12): внутренний ретривал vs внешний поиск.
search_kind:
  - retrieval
  - external

# §4.1. Политика ранжирования (S3, K6). Вход = запрошенный режим;
# вычисленный допустимый ранг определяется sensitivity и не переопределяется входом.
ranking_policy:
  - capability_ranked
  - coverage_fallback
  - unranked

# §6. Политики расчёта.
capability_policy:
  - resolved-only-v1
unknown_policy:
  - excluded
  - unknown_as_zero

# §8. Гейты (S3). Решения персистентны в gate_decisions (S9).
# G1/G2 — внутренняя аттестация (человек в coHound, привязка к профильному дайджесту);
# G3/G4 — точки интеграции: решение приходит извне, coHound его записывает и уважает.
# ОПЕРАЦИОННОЕ перечисление (процесс, а не условие измерения): добавление значений не
# требует бампа версии словаря (§13). Переработка G3/G4 в точки интеграции
# methodology_version не меняет — это подтверждено владельцем. `gate` не является полем
# манифеста, поэтому в METHODOLOGY_FIELDS его нет; провенанс несут строки gate_decisions.
gate:
  - G1
  - G2
  - G3
  - G4

# §8. Кто именно решил гейт (gate_decisions.source).
# Операционное перечисление — без бампа версии словаря (§13).
gate_source:
  - internal   # человек внутри coHound (hound gate, внутренняя аттестация)
  - external   # внешняя система: решение получено и записано, а не принято

# §8. Вердикт решения гейта (gate_decisions.verdict).
# Без явного отказа внешняя интеграция вырождается в «умеет только одобрять»:
# молчание неотличимо от «ещё никто не смотрел».
gate_verdict:
  - approved
  - rejected

# §8. Политика гейта для прогона (run.yaml:gates.<gate>).
# external — ждём решение с совпадающим subject_digest (дефолт);
# waived — решение делегировано процессу вне coHound целиком: гейт не блокирует,
# но факт делегирования записывается и виден в манифесте (невидимый waiver запрещён).
gate_policy:
  - external
  - waived

# §11.7 / §5. Инвалидация ячеек (K2, gaps).
stale_reason:
  - new_build
  - prompt_changed
  - catalog_changed
  - model_changed

# §4.4. Фазы конвейера, в которых пишется search_log.
search_phase:
  - discovery
  - corpus
  - serp
  - scout

# §4.4. Причина терминации поискового протокола (исчерпание).
termination_reason:
  - budget_exhausted
  - results_exhausted
  - sufficient_evidence
  - not_found
  - error

# §6. Аннотация Comparability (кросс-продуктовая).
comparability:
  - HIGH
  - MEDIUM
  - LOW
  - INSUFFICIENT
  - cross-cycle   # при невыполнении alignment-условий когорты

# §6/A1. Класс публикуемости карты — **результат измерения**, а не приговор.
# Правило вывода — ``core.domain.scoring.publishability_profile`` (порядок проверок
# фиксирован: NOT_COMPARABLE → ANALYTICAL_ONLY → PUBLISHABLE_WITH_CAVEAT → PUBLISHABLE),
# числа, из которых класс выведен, публикуются рядом (доля неизвестности, порог,
# coverage, разложение по причинам). Методологическая секция: смена правила вывода —
# версионная граница methodology_version (§13); добавление самой аннотации не меняет
# ни один существующий статус/scoring-формулу и версию словаря не поднимает.
publishability_class:
  PUBLISHABLE: "Coverage и Capability определены, доля неизвестности не выше порога, слабых «нет» не больше объявленной доли, оговорок нет."
  PUBLISHABLE_WITH_CAVEAT: "Публикуется, но с названными оговорками (однопродуктовая когорта, продукт без измерений, Comparability INSUFFICIENT/cross-cycle, слабые «нет» сверх доли)."
  ANALYTICAL_ONLY: "Capability вычислим, но карта как сравнение не публикуется: доля неизвестности выше порога либо coverage ниже объявленного уровня."
  NOT_COMPARABLE: "Сравнивать нечего: Coverage UNDEFINED либо ни у одного продукта нет измеренных ячеек."

# §6/A1. Почему ячейка ВНУТРИ знаменателя Coverage не дала вердикта.
# Причина читается из данных (``EvidenceScope.denial_strength``, состояние ячейки), а не
# назначается: unspecified — «причина не записана», а не догадка о ней.
unknown_cause:
  not_stated: "Вендор не заявил, дословного утверждения нет → ❓ (denial_strength=not_stated)."
  unobserved_scope: "Часть материала не наблюдалась, охват неполон → ❓ (denial_strength=unobserved)."
  instrument_failed: "Измерение не состоялось → failed (I4); denial_strength=instrument_failed."
  pending: "Ячейка не оценена (pending/preliminary-состояние или пара вселенной без строки) — это не вердикт."
  unspecified: "Причина отсутствует в данных (историческая строка без evidence_scope) — публикуется отдельным числом, а не разносится по чужим классам."

# §6/A1. Классы вне знаменателя: не неизвестность, а исключение по правилу.
excluded_cell_class:
  not_applicable: "N/A — человеческое решение о неприменимости (I7); в знаменатель не входит."
  preliminary: "Предварительный вердикт — вне всех расчётов (I13)."
  unresolved_state: "Ячейка в состоянии измерения без применимого статуса: протокол её не засчитывает (аномалия данных, не вердикт)."

# D2. Ось получения страницы (domain_profiles.yaml / FetchPlan).
fetch_mode:
  - http
  - browser

# D2. Ось извлечения (domain_profiles.yaml / FetchPlan).
extraction_route:
  - auto
  - html
  - document

# D4. Ось стратегии краула (FetchPlan): как используется браузер.
crawl_strategy:
  - auto
  - honest
  - hybrid

# P5. Уровень извлечения документных форматов (crawl.document_level): единая лестница.
# Операционное перечисление (commodity-слой, A2) — добавление без бампа версии словаря
# (§13: класс энума — по семантике, не по файлу-носителю). Значения: off — документы не
# извлекаются; text — моделе-независимый нативный парсер; layout — layout-модель без
# таблиц/OCR; layout_tables — layout + TableFormer FAST, OCR off; full — дефолт =
# сегодняшнее поведение (Heron layout + таблицы ACCURATE + авто-OCR).
document_level:
  # NB: ``off`` кавычится — YAML 1.1 трактует unquoted ``off`` как boolean (PyYAML).
  - "off"
  - text
  - layout
  - layout_tables
  - full

# P7. Механизм извлечения PDF (crawl.pdf_pipeline): ось объявляет **механизм**, а не
# библиотеку — конкретная реализация и её сборка записываются в `extractor_version`
# (`docling-doc-3:<level>/docling-<build>` либо `pdfium-text-1`), поэтому смена библиотеки
# внутри механизма видна в провенансе и ключе `extract_cache`, но не меняет смысл оси.
# Операционное перечисление (commodity-слой, A2) — добавление без бампа версии словаря.
# Значения: structured — документный конвейер со структурой (layout-модели, таблицы, OCR;
# сегодня docling; только здесь действует `document_level`); text_layer — только текстовый
# слой PDF, без моделей. Дефолт — structured (сегодняшнее поведение).
pdf_pipeline:
  - structured
  - text_layer

# §4.1/§5. Семейство документа — выбор чанкера (``ExtractedDoc.family`` →
# ``chunker_family``): markdown → чанкер с ``heading_path``, text → абзацный,
# epub → читатель stdlib-OCF + текстовый чанкер. Де-факто перечисление: в коде это
# ``str | None`` с константами ``FAMILY_*`` (``core/util/document_formats.py``), а не
# StrEnum; секция объявлена как единственный источник значений. Валидатор её пока
# не сверяет — см. §4.1 регламента и §14 (перевод в StrEnum).
document_family:
  - markdown
  - text
  - epub

# P6. Глубина спуска в контейнеры (crawl.archive_descent): zip/7z/rar — артефакты,
# из которых достаются документы-члены. ``full`` — спуск исполняется (дефолт);
# ``plan`` — только планирование состава (видимый провенанс, без ингеста членов).
# Операционное перечисление (commodity-слой, A2) — добавление без бампа версии словаря.
archive_descent:
  - plan
  - full

# B3. Исход спуска в один контейнер (archive_observations.status): спуск пишет запись
# всегда — и когда что-то достал, и когда не достал ничего. Операционное перечисление.
archive_descent_status:
  - planned
  - descended
  - unreadable
  - budget_exhausted

# hound package crawl-probe: наблюдаемые значения зонда осей краула по ключам
# domain_profiles.yaml. Операционное перечисление — без бампа версии словаря.
# source — приоритет источника URL (первый хит на ключ); status — исход зонда;
# reason — причина unresolved (A3: ключ честно репортится, не дефолтится).
crawl_probe_status:
  - resolved
  - unresolved
crawl_probe_source:
  - urls
  - corpus
  - synthesized
crawl_probe_confidence:
  - high
  - medium
  - low
crawl_probe_reason:
  - no_url
  - unknown_key
  - both_tiers_failed      # сбой транспорта (raise/unavailable/не-2xx/пустой ответ)
  - extraction_empty       # транспорт дошёл, экстракция дала 0 символов (смотреть экстрактор)
  - browser_unavailable
  - browser_disabled
  - robots_disallowed
  - fetch_budget_exhausted

# Сеанс краула: жизненный цикл (crawl_sessions).
# Операционное перечисление (не методологическое): добавление значения не двигает
# status_dictionary_version и не требует golden-full (§13, правило в шапке файла).
# interrupted — исполнение прервано без размотки (SIGKILL/OOM; снятие оператором в
# foreground-профиле local): тело краула не финализировано, provenance_json не пишется,
# причина — в error. partial остаётся за политическим усечением, failed — за сбоем,
# который конвейер наблюдал сам.
crawl_session_status:
  - created
  - running
  - paused
  - cancelled
  - completed
  - partial
  - interrupted
  - failed

# Элемент сеанса краула: per-URL статус (crawl_session_items).
crawl_item_status:
  - pending
  - running
  - fetched
  - failed
  - cancelled

# Причина пропуска фазы конвейера (PhaseStatus=skipped): отсутствие предпосылки,
# а не сбой и не смена доменного статуса. Пропуск не трогает ячейки и не отменяет I6/I7.
# Операционное перечисление — без бампа версии словаря (§13, METHODOLOGY_FIELDS).
skip_reason:
  - no_search_adapter   # нет поискового адаптера (Ш2/I19)
  - no_queries          # не заданы запросы разведки
  - gate_delegated_external  # гейт делегирован внешнему процессу (run.yaml:gates.<gate>=waived)
  - gate_not_blocking   # гейт не блокирует прогон (G1/G2/G3): решения не требуется,
                        # waiver-строка «решение не требуется» пишется в gate_decisions
  # зарезервировано: объявлено, но пока не излучается ни одной фазой
  - no_urls             # не задан план URL (Ш5) — reserved
  - no_embedder         # нет эмбеддера для плотной ветви — reserved
  - no_registry_spec    # нет реестровой спецификации (Ш3) — reserved

# §4.1 / Р-2. Маппинг сателлита на зачёт. Правила применяются сверху вниз,
# первое совпавшее решает. cap — потолок статуса зачёта.
# Дополняет §4.1 «Маппинг на зачёт (Р-2)».
rule_r2:
  order:
    - id: r2_claimed
      when:
        evidence_state: claimed
      cap: partial
    - id: r2_community_external
      when:
        origin: community
        relationship: external
      cap: none        # зачёт по интеграционным параметрам не даётся
    - id: r2_verified_integrated
      when:
        relationship: [bundled, integrated, certified]
        evidence_state: verified
      cap: ok          # без потолка
    - id: r2_recommended
      when:
        relationship: recommended
        evidence_state: verified
      cap: partial
    - id: r2_external
      when:
        relationship: external
        evidence_state: verified
      cap: parameter_rule   # по rule параметра
    - id: r2_default
      when: {}
      cap: parameter_rule

# §4.1/Р-2. Потолок зачёта (значения ``rule_r2[].cap``) — перечисление ``Cap``.
# ``none`` — зачёт не даётся; ``ok`` — без потолка; ``partial`` — потолок ⚠️;
# ``parameter_rule`` — по ``rule`` параметра каталога. Валидатор секцию пока не
# сверяет (значения используются inline в ``rule_r2``) — см. §4.1/§14 регламента.
cap:
  - none
  - partial
  - ok
  - parameter_rule

# §4.2/§11.1. Тир golden-набора (``GoldenTier``, ``golden.csv``): ``fast`` — PR-страта,
# ``full`` — полный набор (смена модели/правил/каталога, релиз). Перечисление объявлено
# в домене, но секции в словаре не имело — теперь имеет. Валидатор секцию пока не
# сверяет (§4.1/§14 регламента).
golden_tier:
  - fast
  - full

# 09 §3.1/§7. Онбординг продукта и seed-набор (MVP-1).
# Операционные перечисления авторского/прогонного контура — добавление без бампа
# методологической версии словаря (§13: класс энума — по семантике, не по файлу).
seed_role:
  - primary
  - docs
  - satellite
  - host_root
seed_source:
  - add_product
  - discovery
  - migration
  - operator
seed_state:
  - enabled
  - disabled
  - invalid
onboarding_state:
  - ready
  - pending_seeds
  - blocked
  - retired
product_mode:
  - new
  - full
  - incremental
refresh_policy:
  - auto
  - revalidate
  - refresh
  - offline
product_scope:
  - full
  - product_only

# 09 §6.3/§9. Тип элемента инкрементального work-set.
# Операционное перечисление: описывает способ получения документа, не семантику правил.
incremental_kind:
  - fetch
  - revalidate
  - reuse

# 09 §6.3/§9. Классификация переиспользования URL/документа.
# ``reused``/``stale`` — режимы без свежего измерения; ``❌`` на ``stale`` не опирается.
reuse_kind:
  - live
  - revalidated
  - reused
  - stale

# 09 §3.1/§12.1. Идентичность прогона (MVP-2b): класс изменения между прогонами.
# Операционное перечисление: описывает провенанс измерения, не семантику правил;
# добавление — без бампа методологической версии словаря (§13).
change_class:
  - none
  - content_change
  - cohort_expansion
  - cohort_reduction
  - execution_change
  - methodology_change

# 09 §3.1/§6.2. Объём прогона: полный / только сбойные / один продукт.
# Одиночный продукт кодируется в run_id как product:<id>; здесь — категория.
run_scope:
  - full
  - only_failed
  - product_only
